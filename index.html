.dec-tool-read{font-size:12.5px;color:var(--ink2);min-width:260px}
.dec-tool-read b{color:var(--ink)}
.dec-tool-nota{font-size:11px;color:var(--mut);margin-top:7px}
.dec-row.dim{opacity:.35}
.dec-cutline{padding:8px 4px;border-bottom:1px solid var(--line);background:var(--wash);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:center}
</style>
<script>
/* ---------- DASHBOARD ---------- */
let DST={urg:'TODAS',ia:false,q:'',sort:'rank',dir:1};

/* ---------- SIMULADOR DE PRIORIDADES (0.9.0) ----------
   Al reordenar los objetivos en Personalización, la lista se re-puntúa y se
   reordena AL MOMENTO, como ensayo (el orden declarado no cambia hasta la
   próxima edición). scoreMotor() replica la fórmula del motor — REGLA DE
   COLOCACIÓN: motor (sat_engine) + eval A19 + rankParts() + scoreMotor()
   se mueven JUNTOS. Validado: con el orden declarado reproduce rank 152/152. */
let SIM={on:false,obj:null};
const KEYOBJ=o=>{o=(o||'').toUpperCase();
  return o.startsWith('DEFENDER')?'DEFENDER'
    :o.startsWith('CRECER')?'CRECER'
    :(o.startsWith('CONQUISTAR')||o.startsWith('ARREBATAR'))?'CONQUISTAR'
    :(o.startsWith('DIVERSIFICAR')||o.startsWith('EXPLORAR'))?'DIVERSIFICAR'
    :'POSICIONARME';};
function objMult(objs){
  const ORD5=[1.5,1.35,1.2,1.1,1.0];
  const M={DEFENDER:1,CRECER:1,CONQUISTAR:1,DIVERSIFICAR:1,POSICIONARME:1};
  (objs||[]).forEach((o,i)=>{if(ORD5[i]!=null)M[KEYOBJ(o)]=ORD5[i];});
  return M;
}
function objActivos(){return (SIM.on&&SIM.obj)||((D.enfoque&&D.enfoque.objetivos)||[]);}
function scoreMotor(x,M){
  const PERF=({TECNICO:[16,-12],MIXTO:[12,-6],PRECIO:[6,4]})[D.perfil.precio_tecnico]||[12,-6];
  const BASE={TERRENO:40,PRESENCIA:28,DEBIL:12,AUSENTE:4};
  const m=(x.plevel==='TERRENO'||x.plevel==='PRESENCIA')?M.CRECER:(x.plevel==='DEBIL'?M.CONQUISTAR:M.DIVERSIFICAR);
  let s=(BASE[x.plevel]||4)*m;
  if(x.cli_org>0)s+=20*M.DEFENDER;
  if(x.tecnico)s+=PERF[0];
  if(x.subasta)s+=PERF[1];
  if(x.des_rate>=0.06)s+=8;
  if(typeof x.imp==='number'){if(x.imp>=1e6)s+=10;else if(x.imp>=2e5)s+=8;else if(x.imp<5e4)s-=4;}
  if(x.inc_is_rival)s-=5;
  if(x.marco)s+=10*M.POSICIONARME;
  s+=x.en_zona?6:(x.medio_propio?5:0);
  return Math.round(s*10)/10;
}
const rkShow=x=>SIM.on?x.rank_sim:x.rank;
const scoreActivo=x=>SIM.on?x.score_sim:x.score;
function simulaPrioridades(){
  SIM.on=JSON.stringify(FSEL.obj)!==JSON.stringify(FBASE.obj);
  SIM.obj=SIM.on?FSEL.obj.slice():null;
  if(SIM.on){
    const M=objMult(SIM.obj);
    D.ranking.forEach(x=>{x.score_sim=scoreMotor(x,M);});
    // empate: conserva el orden del motor (rank original) — así, con el orden
    // declarado, la simulación reproduce EXACTAMENTE el ranking oficial
    D.ranking.slice().sort((a,b)=>(b.score_sim-a.score_sim)||(a.rank-b.rank))
      .forEach((x,i)=>{x.rank_sim=i+1;});
  }
  drawRows(); renderDecision();
}
window.simReset=function(){FSEL.obj=FBASE.obj.slice();renderFicha();simulaPrioridades();};
function simBannerHTML(){
  if(!SIM.on) return '';
  return `<div class="sim-banner"><b>Ensayo:</b> lista reordenada con tus prioridades de prueba (${SIM.obj.map((o,i)=>`${i+1} ${esc(o)}`).join(' · ')}). Tu orden declarado no cambia hasta la próxima edición. <a class="lk" onclick="simReset()">Volver a mi orden declarado</a></div>`;
}
const TIP={
  estado:{
    PRESENTARSE:'Una de tus categorías fuertes: el encaje con tu trayectoria es directo. Prepara la candidatura.',
    EXPLORAR:'Potencial real, pero revisa el pliego antes de comprometer recursos.',
    CALCULAR:'Puedes ganar si el precio te resulta rentable. Calcula el margen antes de decidir.',
    NO:'Categoría ajena: sin una ventaja que justifique el esfuerzo.'
  },
  urg:{
    YA:'Cierra en 7 días o menos. Es solo un aviso: no cambia el orden del ranking.',
    PRONTO:'Cierra entre 8 y 15 días. Es solo un aviso: no cambia el orden del ranking.',
    MARGEN:'Cierra en más de 15 días: tiempo de sobra para prepararla.'
  },
  lotes:'Se adjudica por lotes: puedes ir a uno, a varios o a todos. El importe que ves es el total del contrato, no lo que te llevarías.',
  mp:'Medio propio o central de contratación: compra para otras administraciones y puede ser tu vía de entrada a ellas.',
  ia:'Tema estratégico que marcaste en Personalización: esta licitación gana peso en tu ranking.'
};
function renderDashShell(){
  document.getElementById('dash').innerHTML=`
  <div class="wrap" style="padding-top:34px">
    <div class="sec-h">Tu lista de trabajo</div>
    <div class="sec-t">Qué priorizar en tu mercado</div>
    <div class="sec-d">Las ${D.resumen.total} licitaciones de tu mercado, <b>del 1º al último puesto</b> según tu histórico, tus prioridades y la competencia${D.capacidad?` — con la línea de capacidad marcando hasta dónde llega tu equipo (${D.capacidad} propuestas)`:``}. Pulsa cualquier fila para ver <b>por qué ocupa ese puesto</b>, contado en una frase — qué juega a su favor y qué en contra con tu enfoque. Su ficha completa y la decisión están en <b>Cómo ganar</b>.${PLAZOS_VIVOS?` Los plazos están recalculados a hoy (${fmtHoy})${CERRADAS?`; <b>${CERRADAS}</b> han cerrado desde el corte y aparecen atenuadas`:''}.`:''}</div>
  </div>
  <div class="wrap">
    <div id="simBanner"></div>
    <div class="toolbar">
      <div class="searchwrap"><svg class="s-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input class="search" id="q" type="search" placeholder="Buscar organismo, categoría o título…"></div>
      <div class="seg" id="segUrg">
        <button data-u="TODAS" class="on">Cualquier plazo</button>
        <button data-u="YA"><span class="udot" style="background:#b1402a"></span>Cierra ya</button>
        <button data-u="PRONTO"><span class="udot" style="background:#9a6a16"></span>Apremia</button>
      </div>
      ${D.ia?`<button class="ia-toggle" id="iaToggle"><span class="udot" style="background:var(--ia)"></span>Tema: Inteligencia Artificial</button>`:''}
      <span class="count" id="count"></span>
    </div>
    <div class="filt-legend">
      <div class="fl-hint">Pulsa una fila para ver por qué ocupa su puesto. La urgencia no influye en el orden: solo avisa del plazo. Ordena por cualquier columna tocando su cabecera; ¿dudas con algún término? Están todos en la <a class="hint-link" onclick="document.querySelector('.tab[data-v=anexo]').click()">Metodología</a>.</div>
    </div>
    </div>
    <div class="wrap"><!-- 0.10.16: la tabla comparte margen con el resto (antes iba a sangre) -->
    <table>
      <thead><tr>
        <th data-s="rank">Ranking</th>
        <th data-s="urg">Urgencia</th>
        <th data-s="titulo">Licitación</th><th data-s="cat2">Categoría</th>
        <th data-s="imp">Importe</th>
        <th data-s="days_live">Cierra</th><th></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <footer><div class="count" id="count2"></div></footer>
  </div>`;
  document.getElementById('segUrg').addEventListener('click',e=>{
    if(e.target.dataset.u){[...e.currentTarget.children].forEach(b=>b.classList.remove('on'));e.target.classList.add('on');DST.urg=e.target.dataset.u;drawRows();}
  });
  const iaT=document.getElementById('iaToggle');
  if(iaT)iaT.addEventListener('click',()=>{DST.ia=!DST.ia;iaT.classList.toggle('on',DST.ia);drawRows();});
  document.getElementById('q').addEventListener('input',e=>{DST.q=e.target.value.toLowerCase();drawRows();});
  document.querySelectorAll('#dash th[data-s]').forEach(th=>th.addEventListener('click',()=>{
    const s=th.dataset.s; DST.dir=(DST.sort===s)?-DST.dir:(s==='imp'||s==='psub'?-1:1); DST.sort=s; drawRows();
  }));
  drawRows();
}
function iaHeader(){
  const a=D.ia; if(!a) return '';
  const verb = a.rank<=3 ? 'estás entre los primeros' : (a.cliente_n>0?'ya has ganado aquí, pero no lideras':'aún no has ganado aquí');
  const lead = (a.lideres||[]).filter(l=>!l.es_cliente)[0];
  const desPct=Math.round(a.des_rate*100);
  return `<div class="ia-head">
    <div class="ia-head-t"><span class="udot" style="background:var(--ia)"></span>Inteligencia Artificial · lo marcaste como prioridad en tu ficha</div>
    <div class="ia-head-body">
      <p><b>Tu posición:</b> ${a.cliente_n} contratos de IA ganados, ${verb} (${ordinal(a.rank)} del mercado).
      ${lead?`Por delante va <b>${tc(lead.grupo)}</b> con ${lead.n}.`:''}
      ${desPct>=4?`Y <b>${desPct}% de los contratos de IA quedan desiertos</b>: hay hueco.`:''}</p>
      <p class="ia-head-note">Estas ${D.ranking.filter(x=>x.ia).length} licitaciones de IA están abiertas hoy. Mientras tengas el tema activado, suben en tu ranking; quítalo y vuelven a su sitio.</p>
    </div>
  </div>`;
}
function ordinal(n){return n?n+'º':'—';}
function markSortHeaders(){
  document.querySelectorAll('#dash thead th[data-s]').forEach(th=>{
    th.classList.remove('sort-asc','sort-desc');
    if(th.dataset.s===DST.sort) th.classList.add(DST.dir>=0?'sort-asc':'sort-desc');
  });
}
function drawRows(){setTimeout(()=>window.applyA11y&&applyA11y(),0);
  markSortHeaders();
  const sb=document.getElementById('simBanner'); if(sb) sb.innerHTML=simBannerHTML();
  let rows=D.ranking.slice();
  if(DST.urg!=='TODAS') rows=rows.filter(x=>x.urg_live===DST.urg&&!x.cerrada);
  if(DST.ia) rows=rows.filter(x=>x.ia);
  if(DST.q) rows=rows.filter(x=>((x.titulo||'')+(x.org||'')+(x.cat2||'')).toLowerCase().includes(DST.q));
  const s=DST.sort,dir=DST.dir;
  const IA_B=(D.ia&&D.ia.boost)||0;
  // con el tema IA activo y orden por ranking, reordena por el empujón
  if(DST.ia && s==='rank'){
    rows.sort((a,b)=>(((b.ia?IA_B:0)+scoreActivo(b))-((a.ia?IA_B:0)+scoreActivo(a)))||(rkShow(a)-rkShow(b)));
  }else{
    rows.sort((a,b)=>{
      if(s==='rank')return dir*(rkShow(a)-rkShow(b));
      if(s==='urg'){const O={YA:0,PRONTO:1,MARGEN:2,CERR:3};return dir*((O[a.urg_live]??9)-(O[b.urg_live]??9));}
      let va=a[s],vb=b[s];if(va==null)va=-1;if(vb==null)vb=-1;if(typeof va==='string')return dir*va.localeCompare(vb);return dir*(va-vb);});
  }
  const ul={YA:'Cierra ya',PRONTO:'Apremia',MARGEN:'Con margen'};
  const head=DST.ia?iaHeader():'';
  // línea de capacidad (spec: "considerando capacidades"): tras la enésima fila
  // accionable (n = capacidad declarada). Solo en el orden natural del ranking,
  // sin búsqueda ni empujón IA, para que la línea signifique lo que dice.
  const CAPN=D.capacidad||0;
  const capOn=CAPN>0&&DST.sort==='rank'&&DST.dir===1&&!DST.q&&!DST.ia;
  let nAccion=0;
  document.getElementById('tb').innerHTML=rows.map(x=>{
    const delta=(SIM.on&&x.rank_sim!==x.rank)?`<small class="rk-delta ${x.rank_sim<x.rank?'up':'down'}">${x.rank_sim<x.rank?'▲':'▼'}${Math.abs(x.rank-x.rank_sim)}</small>`:'';
    const urgCell=x.cerrada?`<span class="t-urg CERR">Cerrada</span>`:`<span class="t-urg tip ${x.urg_live}" data-tip="${TIP.urg[x.urg_live]||''}">${ul[x.urg_live]||''}</span>`;
    const fila=`<tr class="t-main${x.ia?' is-ia':''}${x.cerrada?' is-cerrada':''}" onclick="toggleDetail(this,${x.rank})">
    <td class="t-rank">${rkShow(x)}º${delta}</td>
    <td>${urgCell}</td>
    <td><div class="t-title">${esc(tc(x.titulo))}${x.ia?`<span class="ia-tag tip" data-tip="${TIP.ia}">IA</span>`:''}${x.medio_propio?`<span class="mp-tag tip" data-tip="${TIP.mp}">vía de entrada</span>`:''}${x.multilote?`<span class="lote-tag tip" data-tip="${TIP.lotes}">lotes</span>`:''}</div><div class="t-org">${esc(tc(x.org))}</div></td>
    <td style="font-size:12px;color:var(--ink2)">${esc(tc(x.cat2))}</td>
    <td class="t-imp">${fmt(x.imp)}</td>
    <td style="font-size:12px;color:var(--mut);white-space:nowrap">${x.cerrada?'—':(x.days_live!=null?x.days_live+'d':'—')}</td>
    <td><span class="t-caret">▶</span></td>
  </tr>`;
    if(capOn&&x.estado!=='NO'){
      nAccion++;
      if(nAccion===CAPN) return fila+`<tr class="cap-divider"><td colspan="7">— hasta aquí llega tu capacidad este mes (${CAPN} propuestas) · lo que sigue es mercado real, para ampliar equipo o ir en unión con otra empresa —</td></tr>`;
    }
    return fila;
  }).join('');
  const tb=document.getElementById('tb');
  if(head){tb.insertAdjacentHTML('beforebegin','');const ex=document.getElementById('iaHeadRow');if(ex)ex.remove();
    tb.parentElement.querySelector('thead').insertAdjacentHTML('afterend',`<tbody id="iaHeadRow"><tr><td colspan="7" style="padding:0;border:none">${head}</td></tr></tbody>`);}
  else{const ex=document.getElementById('iaHeadRow');if(ex)ex.remove();}
  const c=`${rows.length} licitaciones`+(DST.ia?' de IA':'');
  document.getElementById('count').textContent=c;
  document.getElementById('count2').textContent=c+' · ordenado por '+(DST.ia&&DST.sort==='rank'?'encaje (con empujón IA)':DST.sort);
}
function fichaHeader(x){
  const frames=[['vigor','Contrato en vigor'],['oport','Oportunidades'],['nuevo','Nuevos mercados']];
  const FR={DEFENDER:'vigor',CRECER:'oport',CONQUISTAR:'oport',DIVERSIFICAR:'nuevo'};
  const active=FR[x.postura]||'oport';
  // DEFENDER se asigna por tener contratos en el organismo (cli_org>0), no por
  // ser titular de ESTE contrato: la etiqueta distingue renovación / relación.
  const STRAT={DEFENDER:x.inc_is_client?'Renovación':(x.cli_org>0?'Ampliar donde ya trabajas':'Defensa de posición'),CRECER:(LBL.estrategia.CRECER.chip),CONQUISTAR:(LBL.estrategia.CONQUISTAR.chip),DIVERSIFICAR:(LBL.estrategia.DIVERSIFICAR.chip)};
  const ENF={DEFENDER:x.inc_is_client?'Renovar el contrato':(x.cli_org>0?'Ampliar la relación':LBL.estrategia.DEFENDER.enfoque),CRECER:LBL.estrategia.CRECER.enfoque,CONQUISTAR:LBL.estrategia.CONQUISTAR.enfoque,DIVERSIFICAR:LBL.estrategia.DIVERSIFICAR.enfoque};
  const estadoAct = x.inc_is_client?'El contrato ya es tuyo'
    : x.incumbente?('Proveedor instalado: '+tc(x.incumbente))
    : 'Sin proveedor instalado previo';
  // Cómo se adjudica: reparto de los 100 puntos del pliego (responde "¿qué son
  // 100?", feedback 0.9.13). En subasta no hay reparto: solo precio.
  let critRow;
  if(x.subasta){
    critRow=`<div class="fh-row"><div class="fh-rk">Cómo se adjudica</div><div class="fh-rv">Solo precio (subasta)</div></div>`;
  }else{
    const tp=x.psub,pp=100-x.psub;
    critRow=`<div class="fh-row"><div class="fh-rk">Cómo se adjudica</div><div class="fh-rv"><div class="fh-critbar"><i style="width:${tp}%"></i></div><div class="fh-critlab"><span><b>Técnica ${tp}</b></span><span>Precio y otros ${pp}</span></div><small>reparto de los 100 puntos del pliego</small></div></div>`;
  }
  // Historial SIN número (feedback 0.9.13: "8 o más" es impreciso — es el suelo
  // de un tramo, no un recuento): etiqueta cualitativa + escala de 4 puntos.
  // La definición exacta de los tramos (≥8/3–7/1–2/0, registro y ventana) vive
  // en la Metodología — COLOCACIÓN: si cambian los umbrales en sat_engine,
  // actualizar glosario + diccionario + Guía (aquí ya no se citan).
  const CATN=tld(tc(x.cat2));
  const LVL=({TERRENO:{n:4,t:'Ganada muchas veces — categoría fuerte'},
              PRESENCIA:{n:3,t:'Ganada varias veces'},
              DEBIL:{n:2,t:'Ganada alguna vez'},
              AUSENTE:{n:0,t:'Nunca ganada'}})[x.plevel]||{n:0,t:'—'};
  const dots=`<span class="fh-dots">${[1,2,3,4].map(i=>`<i${i<=LVL.n?' class="on"':''}></i>`).join('')}</span>`;
  const seg = frames.map(([k,l])=>`<span class="fh-seg${k===active?' on':''}">${l}</span>`).join('');
  const imp = (x.imp!=null)?x.imp.toLocaleString('es-ES',{maximumFractionDigits:0})+' €':'—';
  const dl = x.days_live!=null?x.days_live:x.days_left;
  const urg = !x.cerrada&&dl<=7;
  let desRow='';
  if(x.des_rate!=null && x.des_rate>=0.06){
    const p=Math.round(x.des_rate*100);
    const band=p>=20?'Alto':p>=10?'Medio':'Bajo';
    desRow=`<div class="fh-row"><div class="fh-rk">Riesgo de desierto</div><div class="fh-rv">${p}% <span class="fh-band b-${band.toLowerCase()}">${band}</span></div></div>`;
  }
  let caveat='';
  if(x.baja_est){
    // 0.9.13: de párrafo a banda visual (misma gramática que las bandas de
    // competidores: banda = zona habitual, raya = típico). Texto mínimo.
    const b=x.baja_est, r=n=>Math.round(n);
    const MAXA=Math.max(30,Math.ceil(r(b.p75)/10)*10+5);
    const px=v=>Math.min(v,MAXA)/MAXA*100;
    const l=px(b.p25), w=Math.max(1.5,px(b.p75)-px(b.p25)), m=px(b.med);
    const extra = (!x.subasta && b.cero>=30)?`<div class="fh-range-extra">Aquí suele decidir la técnica, no el precio.</div>`:'';
    caveat=`<div class="fh-caveat"><div class="fh-caveat-h">Descuento ganador habitual · referencia</div>
      <div class="fh-range-track"><i class="band" style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%"></i><i class="med" style="left:${m.toFixed(1)}%"></i></div>
      <div class="fh-range-lab"><span>0%</span><span class="c"><b>${r(b.p25)}–${r(b.p75)}%</b> · típico ${r(b.med)}%</span><span>${MAXA}%</span></div>
      <div class="fh-range-n">Ofertas ganadoras anteriores; no es un umbral.</div>${extra}</div>`;
  }
  return `<div class="fh">
    <div class="fh-frame">${seg}</div>
    <div class="fh-body">
      <div class="fh-strat"><small>Tu estrategia</small>${STRAT[x.postura]||'Oportunidad'}</div>
      <div class="fh-sub">${whyText(x)}</div>
      <div class="fh-grid">
        <div class="fh-figs">
          <div class="fh-fig"><div class="v">${imp}</div><div class="k">Importe del contrato</div></div>
          <div class="fh-fig">${x.cerrada?`<div class="v cerr">Cerrada</div><div class="k">El plazo venció el ${x.lim||'—'}</div>`:`<div class="v${urg?' urg':''}">${dl!=null?dl+' días':'—'}</div><div class="k">Límite ${x.lim||'—'}${PLAZOS_VIVOS?' · a hoy':''}</div>`}</div>
        </div>
        <div class="fh-panel">
          <div class="fh-row"><div class="fh-rk">Enfoque</div><div class="fh-rv">${ENF[x.postura]||'Valorar'}</div></div>
          <div class="fh-row"><div class="fh-rk">Estado</div><div class="fh-rv">${estadoAct}</div></div>
          <div class="fh-row"><div class="fh-rk">Tu historial en ${esc(CATN)}</div><div class="fh-rv">${dots}${LVL.t}<small>en todo el mercado, sobre el registro analizado${D.perfil.hist_desde?` (${D.perfil.hist_desde} – ${D.perfil.hist_hasta})`:''} — la definición exacta, en la Metodología.</small></div></div>
          ${critRow}
          ${desRow}
        </div>
        <div>${caveat}</div>
      </div>
      ${x.info?`<div class="fh-cta"><a href="${esc(x.info)}" target="_blank" rel="noopener">Revisar pliego ↗</a></div>`:''}
    </div>
  </div>`;
}
/* Ficha completa de una licitación: desde 0.7.0 vive SOLO en "Qué hacer con
   cada una" (la fila del bloque ya da el contexto de decisión). En la tabla de
   "Qué priorizar", el detalle es rankDetail(): por qué ocupa ese puesto. */
function detailInner(x){
  return `<div class="t-detail-inner">
    ${fichaHeader(x)}
    ${x.multilote?`<div class="adv-note"><b>Se divide en lotes.</b> Puedes ir a uno, a varios o a todos. El importe que ves es el total del contrato; mira el pliego para saber qué lotes encajan contigo y cuánto vale cada uno.</div>`:''}
    ${x.medio_propio?`<div class="adv-note" style="border-color:var(--mp-line);background:var(--mp-bg)"><b style="color:var(--mp)">Vía de entrada.</b> Este organismo es un medio propio o central de contratación: compra en nombre de otras administraciones. Presentarte aquí puede abrirte la puerta a servir a esas administraciones aunque no estén en tus zonas habituales.</div>`:''}
    ${x.ia?`<div class="adv-note" style="border-color:var(--ia-line);background:var(--ia-bg)"><b style="color:var(--ia)">Tema estratégico: Inteligencia Artificial.</b> La marcaste como prioridad en <b>Personalización</b> (al final de Cómo leerlo), así que esta licitación gana peso en tu ranking. El botón “Tema: Inteligencia Artificial” las reúne todas y muestra tu posición frente a la competencia en IA.</div>`:''}
    ${x.ute_habitual?`<div class="adv-note"><b>Aquí es habitual presentarse en UTE.</b> En esta categoría, parte de los contratos los ganan empresas asociadas. Si sola no llegas al tamaño o a los requisitos, plantéate una unión temporal con otra empresa.</div>`:''}
  </div>`;
}
/* ---- POR QUÉ ESE PUESTO, narrado ----
   Los factores salen de la MISMA fórmula que el motor (sat_engine) y la eval
   A19 — aquí solo se usan para saber QUÉ pesó y con qué signo/orden; los
   puntos no se muestran (petición del cliente: narrado, sin puntuaciones).
   REGLA DE COLOCACIÓN: si cambian los pesos, los objetivos o sus
   multiplicadores en el motor, actualizar A LA VEZ motor + eval A19 + esto. */
let RK_TAM_DISCRIMINA=null;   // ¿el tamaño del contrato distingue unas filas de otras?
function rankParts(x){
  // multiplicadores del ORDEN ACTIVO (declarado, o el de ensayo si el simulador
  // está encendido) — así la narración del puesto cuadra con la lista que se ve
  const OBJM=objMult(objActivos());
  const PERF=({TECNICO:[16,-12],MIXTO:[12,-6],PRECIO:[6,4]})[D.perfil.precio_tecnico]||[12,-6];
  // Tamaño del contrato: el motor lo puntúa, pero si TODAS las filas caen en el
  // mismo tramo (p. ej. con la restricción de ≥1 M€ todas son "grandes"), el
  // criterio no discrimina y NO explica el puesto — se omite de la narración.
  const tier=imp=>typeof imp!=='number'?null:(imp>=1e6?'G':imp>=2e5?'M':imp<5e4?'P':'N');
  if(RK_TAM_DISCRIMINA===null) RK_TAM_DISCRIMINA=new Set(D.ranking.map(z=>tier(z.imp))).size>1;
  const f=[];
  if(x.cli_org>0) f.push({v:20*OBJM.DEFENDER,t:x.inc_is_client?'<b>este contrato ya es tuyo</b>: renovación con ventaja de continuidad':`<b>ya trabajas con este organismo</b> (${x.cli_org} contrato${x.cli_org===1?'':'s'} tuyo${x.cli_org===1?'':'s'} aquí)`});
  if(x.tecnico) f.push({v:PERF[0],t:`se adjudica por propuesta técnica más que por precio, donde compites mejor`});
  if(x.subasta) f.push({v:PERF[1],t:PERF[1]>0?'es subasta a precio puro, y tu perfil encaja ahí':'es <b>subasta a precio puro</b>, donde tu perfil encaja peor'});
  if(x.des_rate>=0.06) f.push({v:8,t:`queda desierta el <b>${Math.round(x.des_rate*100)} %</b> de las veces: demanda sin oferta válida`});
  if(RK_TAM_DISCRIMINA&&typeof x.imp==='number'){
    if(x.imp>=1e6) f.push({v:10,t:'es de los contratos grandes del mes'});
    else if(x.imp>=2e5) f.push({v:8,t:'es un contrato de tamaño medio'});
    else if(x.imp<5e4) f.push({v:-4,t:'es un contrato pequeño'});
  }
  if(x.inc_is_rival) f.push({v:-5,t:'este contrato lo tiene hoy un <b>rival instalado</b>'});
  if(x.marco) f.push({v:10*OBJM.POSICIONARME,t:'es acuerdo marco: posiciona para adjudicaciones futuras'});
  if(x.en_zona) f.push({v:6,t:'está en tus zonas'});
  else if(x.medio_propio) f.push({v:5,t:'el organismo compra para otras administraciones (medio propio): posible puerta de entrada'});
  return f;
}
function rankDetail(x){
  // arranque: el historial, que es la base del puesto (alta o baja). Corto a
  // propósito (0.9.9, feedback: "encuentro repetitivo"): la aclaración de qué
  // cuenta el historial (todo el mercado, registro analizado con su ventana)
  // vive UNA vez en el glosario y en la ficha, no en cada una de las 152 filas.
  const c=esc(tld(tc(x.cat2)));
  const LEAD={
    TERRENO:`<b>Has ganado muchas veces contratos de ${c}</b> en el mercado: tu base más sólida`,
    PRESENCIA:`<b>Has ganado varias veces contratos de ${c}</b> en el mercado: base sólida`,
    DEBIL:`<b>Solo has ganado alguna vez contratos de ${c}</b>: base modesta`,
    AUSENTE:`<b>Nunca has ganado un contrato de ${c}</b>: partes casi de cero`
  }[x.plevel]||'Tu historial en la categoría marca la base';
  const f=rankParts(x).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const pos=f.filter(p=>p.v>0).map(p=>p.t), neg=f.filter(p=>p.v<0).map(p=>p.t);
  const lista=a=>a.length===1?a[0]:a.slice(0,-1).join('; ')+'; y '+a[a.length-1];
  let p1=`${LEAD}.`;
  if(pos.length) p1+=` <b>A favor:</b> ${lista(pos)}.`;
  if(neg.length) p1+=` <b>En contra:</b> ${lista(neg)}.`;
  const iaB=(D.ia&&D.ia.boost)||0;
  const p2=(x.ia&&iaB)?`<p class="rk-p rk-ia">Además, es del tema que marcaste como estratégico (<b>Inteligencia Artificial</b>): mientras el tema siga activo, sube puestos; si lo desactivas en Personalización, vuelve a su sitio.</p>`:'';
  return `<div class="rk-exp">
    <div class="rk-h">Por qué ocupa el puesto ${rkShow(x)}º de ${D.ranking.length}${SIM.on?' <span class="rk-sim">(con tus prioridades de ensayo)</span>':''}</div>
    <p class="rk-p">${p1}</p>
    ${p2}
    <div class="rk-nota">Decisión: <b>${DEC_LBL[x.estado]||x.estado}</b> — el porqué y la ficha completa, en <a class="lk" onclick="document.querySelector('.tab[data-v=decision]').click()">Cómo ganar</a>.</div>
  </div>`;
}
window.toggleDetail=function(tr,rank){
  const next=tr.nextElementSibling;

/* ---------- QUÉ HACER CON CADA UNA (entrega 3: el go/no-go argumentado) ----------
   Mismas filas y mismo rank que "Qué priorizar": aquí se agrupan por decisión y el
   porqué (whyText) va A LA VISTA, sin tener que pulsar. Pulsar abre la ficha completa. */
const DEC_ORDER=['PRESENTARSE','EXPLORAR','CALCULAR','NO'];
const DEC_LBL={PRESENTARSE:'Presentarse',EXPLORAR:'Explorar primero',CALCULAR:'Calcular primero',NO:'No presentarse'};
const DEC_COL={PRESENTARSE:'var(--go)',EXPLORAR:'var(--explore)',CALCULAR:'var(--calc)',NO:'var(--no)'};
let DEC_PRES=[];   // filas de PRESENTARSE, en orden de rank (para la barra de corte)
function decRow(x,di){
  const dl=x.cerrada?'plazo cerrado':(x.days_live==null?'':(x.days_live===0?'cierra hoy':`cierra en ${x.days_live} días`));
  return `<div class="dec-row${x.cerrada?' is-cerr':''}"${di!=null?` data-i="${di}"`:''} onclick="toggleDecDetail(this,${x.rank})">
    <div class="dec-rank">${rkShow(x)}º</div>
    <div class="dec-main">
      <div class="dec-tit">${esc(tc(x.titulo))}</div>
      <div class="dec-org">${esc(tc(x.org))} · ${esc(tc(x.cat2))}</div>
      <div class="dec-why">${whyText(x)}</div>
    </div>
    <div class="dec-side"><div class="imp">${fmt(x.imp)}</div><div class="dl">${dl}</div></div>
  </div>`;
}
function renderDecision(){
  const g={}; DEC_ORDER.forEach(k=>g[k]=[]);
  // orden activo (simulación incluida): mismo puesto que en "Qué priorizar"
  D.ranking.slice().sort((a,b)=>rkShow(a)-rkShow(b)).forEach(x=>{if(g[x.estado])g[x.estado].push(x);});
  const tot=D.ranking.length||1;
  const eur=k=>g[k].reduce((a,x)=>a+(x.imp||0),0);
  const VIS=5;   // 5 visibles por decisión; el resto, en el desplegable
  const tiles=DEC_ORDER.map(k=>`<div class="dec-tile ${k}" onclick="document.getElementById('dec-${k}').scrollIntoView({behavior:'smooth'})">
      <span class="t-tag ${k}">${DEC_LBL[k]}</span>
      <div class="v">${g[k].length}</div>
      <div class="e">${fmtM(eur(k))} en juego</div>
    </div>`).join('');
  // (tiles con clase de decisión para la regla+tinte — ver CSS .dec-tile.<k>)
  // La barra apilada se retiró en 0.10.17 a petición del usuario: era redundante
  // con las tarjetas, que ahora llevan el color de su decisión (regla + tinte).
  const blocks=DEC_ORDER.map(k=>{
    const rows=g[k];
    if(!rows.length) return `<section class="dec-block" id="dec-${k}">
      <div class="dec-head" style="border-top:3px solid ${DEC_COL[k]}"><span class="t-tag ${k}">${DEC_LBL[k]}</span><span class="dec-n">ninguna este mes</span><span class="dec-up" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ vista general</span></div>
      <div class="dec-def">${TIP.estado[k]||''} Este mes, con tu enfoque y tus restricciones, ninguna licitación cae en esta decisión.</div>
    </section>`;
    const pres=k==='PRESENTARSE';
    const vis=rows.slice(0,VIS).map((x,i)=>decRow(x,pres?i:null)).join('');
    const resto=rows.slice(VIS);
    // Barra de corte (solo en Presentarse): convierte el bloque de resultado en
    // herramienta — "¿cuántas puedo preparar?" — sin tocar ninguna cifra del informe.
    const tool=pres?`<div class="dec-tool">
      <div class="dec-tool-t">De resultado a decisión: ¿cuántas candidaturas puedes preparar este mes?</div>
      <div class="dec-tool-move">↔ Mueve la barra</div>
      <div class="dec-tool-row">
        <input type="range" id="decCut" min="1" max="${rows.length}" step="1" value="${(D.capacidad&&D.capacidad<=rows.length)?D.capacidad:rows.length}" oninput="decCutMove(+this.value)">
        <div class="dec-tool-read" id="decRead"></div>
      </div>
      <div class="dec-tool-nota">Las que quedan por debajo del corte se atenúan. Es un ensayo tuyo y no cambia el informe; cuando declares tu capacidad mensual en <b>Personalización</b> (al final de Cómo leerlo), la próxima edición saldrá con este corte ya fijado.</div>
    </div>`:'';
    return `<section class="dec-block" id="dec-${k}">
      <div class="dec-head" style="border-top:3px solid ${DEC_COL[k]}"><span class="t-tag ${k}">${DEC_LBL[k]}</span><span class="dec-n">${rows.length} licitaciones · ${fmtM(eur(k))}</span><span class="dec-up" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ vista general</span></div>
      <div class="dec-def">${TIP.estado[k]||''}</div>
      ${tool}
      ${vis}
      ${resto.length?`<details class="pleg" style="margin-top:10px"><summary>Ver las ${resto.length} restantes de “${DEC_LBL[k]}”</summary><div class="pleg-body">${resto.map((x,i)=>decRow(x,pres?i+VIS:null)).join('')}</div></details>`:''}
    </section>`;
  }).join('');
  DEC_PRES=g.PRESENTARSE;
  document.getElementById('decision').innerHTML=`
  <div class="wrap" style="padding-top:34px">
    <div class="sec-h">Las decisiones</div>
    <div class="sec-t">Cómo ganar — qué hacer con cada una</div>
    <div class="sec-d">Cada licitación de tu mercado lleva una de <b>cuatro decisiones</b>, argumentada con tu histórico y con cómo se adjudica el concurso. Aquí las lees agrupadas por decisión, con el porqué a la vista; el puesto (1º, 2º…) es el mismo que en <b>Qué priorizar</b>. Pulsa una fila para abrir su ficha completa.</div>
    ${simBannerHTML()}
    <div class="tam-h" style="margin-top:20px">De tus ${D.ranking.length} licitaciones, cuántas caen en cada decisión</div>
    <div class="dec-strip">${tiles}</div>
    ${blocks}
  </div>
  <footer><div class="wrap"><div style="max-width:var(--measure)">La decisión recomienda, no decide: el porqué está a la vista para que la última palabra sea tuya.</div></div></footer>`;
  if(DEC_PRES.length) decCutMove(+(document.getElementById('decCut')||{value:DEC_PRES.length}).value);
}
window.decCutMove=function(k){
  const P=DEC_PRES; if(!P.length) return;
  k=Math.max(1,Math.min(k,P.length));
  const eur=a=>a.reduce((s,x)=>s+(x.imp||0),0);
  const sel=P.slice(0,k), fuera=P.slice(k);
  const urg=sel.filter(x=>!x.cerrada&&x.days_live!=null&&x.days_live<=15).length;
  const read=document.getElementById('decRead');
  if(read) read.innerHTML=`Las <b>${k}</b> primeras suman <b>${fmtM(eur(sel))}</b>`+
    (urg?` · <b>${urg}</b> cierra${urg===1?'':'n'} en 15 días o menos`:'')+
    (fuera.length?` · quedan <b>${fuera.length}</b> fuera (${fmtM(eur(fuera))})`:` · sin corte: todas dentro`);
  document.querySelectorAll('#dec-PRESENTARSE .dec-row[data-i]').forEach(el=>el.classList.toggle('dim',+el.dataset.i>=k));
  document.querySelectorAll('#dec-PRESENTARSE .dec-cutline').forEach(e=>e.remove());
  if(fuera.length){
    const last=document.querySelector(`#dec-PRESENTARSE .dec-row[data-i="${k-1}"]`);
    if(last){const d=document.createElement('div');d.className='dec-cutline';d.textContent=`— hasta aquí llegas con ${k} propuesta${k===1?'':'s'} —`;last.after(d);}
  }
  const sl=document.getElementById('decCut'); if(sl&&+sl.value!==k) sl.value=k;
};

/* ---------- diferencias respecto a lo inferido ---------- */
function fdiff(cur,base){const c=cur||[],b=base||[];return {added:c.filter(x=>!b.includes(x)),removed:b.filter(x=>!c.includes(x))};}
function enfoqueChanges(){
  return {
    tec:fdiff(FSEL.tec,FBASE.tec),
    mer:fdiff(FSEL.mer,FBASE.mer),
    perf:(FSEL.perf!==FBASE.perf)?{de:FBASE.perf,a:FSEL.perf}:null,
    cap:(FSEL.cap!==FBASE.cap)?{de:FBASE.cap,a:FSEL.cap}:null,
    rest:(FSEL.rest!==FBASE.rest)?{de:FBASE.rest,a:FSEL.rest}:null,
    objCh:JSON.stringify(FSEL.obj)!==JSON.stringify(FBASE.obj)
  };
}
function countChanges(){const c=enfoqueChanges();return c.tec.added.length+c.tec.removed.length+c.mer.added.length+c.mer.removed.length+(c.perf?1:0)+(c.cap?1:0)+(c.rest?1:0)+(c.objCh?1:0);}
function enfoqueDiff(){
  const c=enfoqueChanges(),n=countChanges(),L=[];
  L.push('CAMBIOS RESPECTO A LO INFERIDO  ('+n+')');
  L.push('(lo que ajustaste sobre lo deducido de tu histórico)','');
  if(n===0){L.push('Sin cambios: las preferencias están tal como se dedujeron de tu histórico.');return L.join('\n');}
  const blk=(t,a)=>{if(a.length){L.push(t);a.forEach(x=>L.push('  \u2022 '+x));L.push('');}};
  blk('Tecnologías AÑADIDAS:',c.tec.added);
  blk('Tecnologías QUITADAS:',c.tec.removed);
  blk('Mercados AÑADIDOS:',c.mer.added);
  blk('Mercados QUITADOS:',c.mer.removed);
  if(c.perf)L.push('Perfil de competencia:  '+c.perf.de+'  \u2192  '+c.perf.a,'');
  if(c.rest)L.push('Restricci\u00f3n de tama\u00f1o:  '+c.rest.de+'  \u2192  '+c.rest.a,'');
  if(c.cap)L.push('Capacidad mensual:  '+c.cap.de+'  \u2192  '+c.cap.a,'');
  if(c.objCh){L.push('Objetivos reordenados:');FSEL.obj.forEach((o,i)=>L.push('  '+(i+1)+'. '+o));L.push('');}
  return L.join('\n').replace(/\n+$/,'');
}

function initObjDrag(){
  const list=document.getElementById('objRanks'); if(!list) return;
  let dragEl=null;
  list.querySelectorAll('.rankitem').forEach(it=>{
    it.addEventListener('dragstart',()=>{dragEl=it;setTimeout(()=>it.classList.add('dragging'),0);});
    it.addEventListener('dragend',()=>{it.classList.remove('dragging');dragEl=null;
      const nuevo=[...list.querySelectorAll('.rankitem')].map(r=>r.dataset.obj);
      if(JSON.stringify(nuevo)!==JSON.stringify(FSEL.obj)){FSEL.obj=nuevo;renderFicha();simulaPrioridades();}
    });
    it.addEventListener('dragover',e=>{e.preventDefault();
      const after=objDragAfter(list,e.clientY);
      if(!dragEl)return;
      if(after==null)list.appendChild(dragEl); else list.insertBefore(dragEl,after);
    });
  });
}
function objDragAfter(list,y){
  const els=[...list.querySelectorAll('.rankitem:not(.dragging)')];
  let best=null,bestOff=-Infinity;
  els.forEach(ch=>{const b=ch.getBoundingClientRect();const off=y-b.top-b.height/2;if(off<0&&off>bestOff){bestOff=off;best=ch;}});
  return best;
}

        <details><summary>El importe que veo, ¿es lo que ganaría?</summary><div class="faq-a">No necesariamente. Si la licitación va por <b>lotes</b>, puedes ir solo a algunos; el importe mostrado es el total del contrato. El pliego dice qué lotes hay y cuánto vale cada uno.</div></details>
        <details><summary>¿Qué diferencia hay entre lotes y UTE?</summary><div class="faq-a">Comparten la idea de “repartir”, pero no son lo mismo:
          <div class="cmp-wrap" style="margin-top:10px"><table class="cmp">
            <thead><tr><th></th><th>Lotes</th><th>UTE</th></tr></thead>
            <tbody>
              <tr><th>Qué es</th><td>La licitación se divide en partes que se adjudican por separado.</td><td>Presentarte aliado con otra empresa en unión temporal.</td></tr>
              <tr><th>Qué implica</th><td>Puedes ir a uno, a varios o a todos: el importe que ves es el total, no lo que te llevarías.</td><td>Una vía cuando sola no llegas al tamaño o a los requisitos.</td></tr>
              <tr><th>Dónde aparece</th><td>Etiqueta <b>lotes</b> junto al título.</td><td>Aviso en el detalle, en categorías donde es habitual.</td></tr>
            </tbody>
          </table></div>
        </div></details>
        <details><summary>“Mi descuento típico” y “el descuento ganador del mercado”, ¿no son lo mismo?</summary><div class="faq-a">No, y es la confusión más habitual. Comparten palabra, pero:
          <div class="cmp-wrap" style="margin-top:10px"><table class="cmp">
            <thead><tr><th></th><th>Tu descuento típico (perfil)</th><th>Descuento ganador del mercado</th></tr></thead>
            <tbody>
              <tr><th>Qué es</th><td>El descuento con el que <b>tú</b> sueles ganar tus contratos.</td><td>El descuento con el que <b>otros</b> ganaron contratos parecidos.</td></tr>
              <tr><th>De dónde sale</th><td>Tu propio histórico de adjudicaciones.</td><td>Todos los adjudicatarios de esa categoría y tipo de concurso.</td></tr>
              <tr><th>Para qué sirve</th><td>Ajusta cómo se valoran las subastas frente a los concursos técnicos en tu ranking.</td><td>Te orienta sobre cuánto se rebaja para ganar ahí.</td></tr>
              <tr><th>Dónde la ves</th><td>En <b>Personalización</b> (Cómo leerlo) → Perfil de competencia.</td><td>En el detalle de cada licitación.</td></tr>
              <tr><th>¿Cambia el orden?</th><td>Sí: es una lente del ranking.</td><td>No: solo informa.</td></tr>
            </tbody>
          </table></div>
        </div></details>
        <details><summary>¿El “descuento ganador del mercado” es el umbral para ganar?</summary><div class="faq-a">No. Es un <b>suelo orientativo</b>: recoge solo a quienes ganaron, no contra qué ofertas competían. Y en muchas categorías el precio apenas decide, así que rebajar mucho no garantiza nada.</div></details>
        <details><summary>¿Por qué esta lista y no la de otra empresa?</summary><div class="faq-a">El orden lo fija tu <b>encaje real con tu histórico</b> de adjudicaciones. Tus preferencias en Personalización lo afinan, pero no falsean la ventaja real.</div></details>
        <details><summary>¿Cada cuánto se actualiza?</summary><div class="faq-a">Es la foto de hoy. Las licitaciones salen a diario y los plazos rondan dos semanas, así que el informe se renueva cada mes.</div></details>
        <details><summary>¿Puedo cambiar mis prioridades, y cada cuánto?</summary><div class="faq-a">Sí. <b>La personalización es mensual: se ajusta con cada renovación del informe.</b> En <b>Personalización</b> (al final de Cómo leerlo), si reordenas tus objetivos <b>la lista se reordena al momento</b>, como ensayo; el resto de campos (tecnologías, mercados, capacidad…) se aplican en la siguiente edición. Con “Exportar mi enfoque” te llevas la configuración —resumen, solo cambios o JSON— para que la próxima salga con tus prioridades.</div></details>
        <details><summary>¿Qué viene después?</summary><div class="faq-a"><b>De encaje a probabilidad real: el aprendizaje.</b> Hoy sabemos dónde has ganado, pero no a qué te presentaste y perdiste, porque ese dato no es público. Si nos compartes el resultado de cada propuesta (qué ganaste y qué no), la recomendación podrá aprender de tu propio historial y pasar de “dónde encajas” a “con qué frecuencia sueles ganar aquí”. Es el siguiente paso: cerrar el punto ciego con tu información y ajustar a tu realidad, no solo a la del mercado.</div></details>
      </div>
    </section>
  </div>`;

/* Navegación por hash (0.9.5): la URL refleja la pestaña (#dossier, #decision…),
   así el botón atrás funciona y una vista concreta se puede enlazar/compartir.
   HTML nativo primero: el estado vive en la URL, no solo en clases CSS. */
function activaTab(id){
  if(!document.getElementById(id)) id='guia';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  if(('#'+t.dataset.v)!==location.hash) location.hash=t.dataset.v; else activaTab(t.dataset.v);
}));
window.addEventListener('hashchange',()=>activaTab(location.hash.slice(1)||'guia'));
/* 0.11.0 — accesibilidad de teclado: todo clicable no nativo recibe foco y rol,
   y Enter/Espacio equivalen al clic. Se re-aplica tras cada re-render. */
window.applyA11y=function(){
  document.querySelectorAll('[onclick]:not(button):not(a):not(summary):not(input):not([tabindex])').forEach(e=>{e.tabIndex=0;e.setAttribute('role','button');});
  document.querySelectorAll('.tip:not([tabindex])').forEach(e=>{e.tabIndex=0;});
};
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click();}
});
renderDossier();renderDashShell();renderDecision();renderGuia();renderFicha();renderAnexo();applyA11y();
if(location.hash) activaTab(location.hash.slice(1));
</script>
