body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--brand-dark);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding-top:9px;padding-bottom:9px}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;letter-spacing:-.01em;color:#fff}
.brand-logo{height:30px;width:auto;display:block}
.brand-sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
.brand-sub{font-weight:400;color:rgba(255,255,255,.62);font-size:12px;letter-spacing:.03em;white-space:nowrap}
.brand-txt{display:flex;flex-direction:column;gap:3px;line-height:1.1}
.brand-case{display:flex;align-items:center;gap:7px}
.brand-casename{font-size:11px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.01em;white-space:nowrap}
.brand-demo{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:2px 6px;border-radius:6px;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:15px}
.brand small{display:block;font-weight:400;color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.tab{border:none;background:none;font:inherit;font-size:13px;font-weight:500;color:rgba(255,255,255,.58);padding:7px 15px;border-radius:6px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.12;white-space:nowrap}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.wm{font-size:16px;letter-spacing:-.02em;font-weight:400}
.wm b{font-weight:700}

.view{display:none}.view.on{display:block}

/* hero / dossier */
.hero{padding:34px 0 28px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
/* 0.10.5: el hero usa la MISMA escala que los títulos de pestaña (.sec-t) —
   una sola jerarquía en todo el documento (kicker 11px mono / título 25px
   Fraunces / descripción 14.5px). */
.hero h1{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:25px;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
/* Criterio de salto de línea en títulos (0.10.3): líneas equilibradas
   (text-wrap:balance) + unidades de significado indivisibles (.nb). */
h1,h2,h3,.sec-t,.guia-h,.tam-h{text-wrap:balance}
.nb{white-space:nowrap}
.hero .sub{margin-top:8px;font-size:14.5px;color:var(--ink2);max-width:var(--measure)}
.metaline{margin-top:26px;display:flex;flex-wrap:wrap;gap:26px;font-size:12.5px;color:var(--mut)}
.metaline b{color:var(--ink);font-weight:600}

/* summary band */
.band{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:34px 0}
.cell{background:var(--card);padding:20px 22px}
.cell .n{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:34px;font-weight:500;line-height:1}
.cell .l{font-size:12px;color:var(--mut);margin-top:7px;font-weight:500}
.cell .d{font-size:11.5px;color:var(--ink2);margin-top:9px;line-height:1.4}
.cell.go .n{color:var(--go)} .cell.exp .n{color:var(--explore)}
.cell.calc .n{color:var(--calc)} .cell.no .n{color:var(--no)}

section{padding:42px 0;border-bottom:1px solid var(--line2)}
.sec-h{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.sec-t{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:25px;letter-spacing:-.01em;margin-bottom:6px}
.sec-d{font-size:14.5px;color:var(--ink2);max-width:var(--measure);margin-bottom:26px}

/* opportunity cards */
.opp{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0;margin-bottom:14px;overflow:hidden}
.opp-top{display:flex;gap:16px;padding:18px 22px;align-items:flex-start}
.tag{flex-shrink:0;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10.5px;font-weight:500;letter-spacing:.04em;padding:5px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap;margin-top:2px}
.tag.PRESENTARSE{background:var(--go-bg);color:var(--go)}
.tag.EXPLORAR{background:var(--explore-bg);color:var(--explore)}
.tag.CALCULAR{background:var(--calc-bg);color:var(--calc)}
.tag.NO{background:var(--no-bg);color:var(--no)}
.opp-body{flex:1;min-width:0}
.opp-cat{font-size:11.5px;color:var(--mut);font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;letter-spacing:.02em;margin-bottom:3px}
.opp-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35}
.opp-org{font-size:13px;color:var(--ink2);margin-top:3px}
.opp-right{flex-shrink:0;text-align:right}
.opp-imp{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:19px;font-weight:500}
.opp-meta{font-size:11px;color:var(--mut);margin-top:3px}
.opp-why{background:var(--wash);border-top:1px solid var(--line2);padding:13px 22px;font-size:13.5px;color:var(--ink2)}
.opp-why b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11px;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}

/* strategic grid */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px}
.scard h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:18px;margin-bottom:4px}
.scard .lead{font-size:13px;color:var(--mut);margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.row:last-child{border:none}
.row .nm{color:var(--ink);font-weight:500}.row .nm small{color:var(--mut);font-weight:400;display:block;font-size:11.5px}
.row .vv{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13px;color:var(--ink2);text-align:right}
.bar{height:5px;border-radius:6px;background:var(--line);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.note{font-size:12.5px;color:var(--mut);border-left:2px solid var(--line);padding:10px 0 10px 16px;margin-top:20px;line-height:1.5}
.note b{color:var(--ink2)}

/* dashboard */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:22px 0;position:sticky;top:62px;background:var(--paper);z-index:20;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:3px;background:var(--wash);padding:3px;border-radius:6px}
.seg button{border:none;background:none;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink2);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
#segUrg button[data-u="YA"].on{background:#fbe9e7;color:#b1402a}
#segUrg button[data-u="PRONTO"].on{background:#fbf2dd;color:#9a6a16}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
#segUrg .udot{opacity:.5}
#segUrg button.on .udot{opacity:1}
.money-hero{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:30px 0 14px}
.mh-main{flex:1.6;background:linear-gradient(135deg,#1f3a2e,#2a5443);color:#fff;padding:26px 28px}
.mh-label{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
.mh-fig{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:46px;font-weight:500;line-height:1;letter-spacing:-.02em}
.mh-sub{font-size:13.5px;opacity:.9;margin-top:12px;line-height:1.5;max-width:var(--measure)}
.mh-sub b{opacity:1;color:#fff}
.mh-side{flex:1;background:var(--card);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.mh-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.mh-row b{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:17px;color:var(--ink);font-weight:500}
.mh-row.total{border:none;padding-top:12px}.mh-row.total span{font-weight:600;color:var(--ink)}.mh-row.total b{color:var(--go)}
.vol-warn{background:var(--wash);border-left:3px solid var(--go);border-radius:12px;padding:15px 18px;font-size:13.5px;color:var(--ink2);line-height:1.55;margin:14px 0 0}
.vol-warn b{color:var(--ink)}
.vol-warn b{color:#5a3f0a}
@media(max-width:680px){.money-hero{flex-direction:column}.mh-fig{font-size:38px}}
.summary{margin:30px 0 14px}
.sm-head{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sm-item{background:var(--card);padding:18px 20px}
.sm-fig{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:28px;font-weight:500;line-height:1;color:var(--ink)}
.sm-txt{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.4}
.sm-item.alert .sm-fig{color:#b1402a}
@media(max-width:680px){.sm-grid{grid-template-columns:repeat(2,1fr)}}
/* Buscador (0.9.10): primero en la barra (patrón F: lo primero que se lee),
   lupa dentro y foco visible — antes pasaba desapercibido al final de la fila. */
.searchwrap{position:relative;flex:1 1 260px;min-width:220px}
.s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 13px 9px 34px;font:inherit;font-size:13px;background:var(--card);box-shadow:0 1px 2px rgba(17,17,17,.05);transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--mut)}
.search:hover{border-color:var(--mut)}
.search:focus{outline:none;border-color:var(--accent-fill);box-shadow:0 0 0 3px rgba(0,153,237,.16)}
.search:focus~.s-ico,.searchwrap:focus-within .s-ico{color:var(--accent)}
.search::-webkit-search-cancel-button{-webkit-appearance:none}
.count{font-size:12.5px;color:var(--mut);font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
thead th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:12px 10px;border-bottom:1px solid var(--line);position:sticky;top:122px;background:var(--paper);cursor:pointer;white-space:nowrap}
thead th:hover{color:var(--ink)}
thead th[data-s]::after{content:"\2195";margin-left:6px;font-size:9px;font-weight:700;opacity:.3;vertical-align:1px}
thead th[data-s]:hover::after{opacity:.6}
thead th.sort-asc::after{content:"\25B2";opacity:1}
thead th.sort-desc::after{content:"\25BC";opacity:1}
thead th.sort-asc,thead th.sort-desc{color:var(--ink)}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:var(--wash)}
.t-rank{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;color:var(--mut);font-size:12px}
.t-tag{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;font-weight:500;padding:3px 7px;border-radius:6px;white-space:nowrap}
.t-tag.PRESENTARSE{background:var(--go-bg);color:var(--go)}.t-tag.EXPLORAR{background:var(--explore-bg);color:var(--explore)}
.t-tag.CALCULAR{background:var(--calc-bg);color:var(--calc)}.t-tag.NO{background:var(--no-bg);color:var(--no)}
/* 0.10.12: el título de la licitación usa (casi) toda su columna — antes topaba
   en 340px y dejaba un vacío enorme hasta CATEGORÍA, con cajas de 2-3 líneas.
   Es una celda de tabla, no prosa: su límite es la columna, con 24px de respiro. */
.t-title{font-weight:500;color:var(--ink);max-width:none;padding-right:24px}
.t-org{color:var(--mut);font-size:12px;margin-top:2px}
.t-imp{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;white-space:nowrap}
.t-post{font-size:11px;color:var(--ink2)}
.lk{color:var(--accent);text-decoration:none;font-size:12px}.lk:hover{text-decoration:underline}
.t-main{cursor:pointer}
.t-caret{color:var(--mut);font-size:10px;display:inline-block;transition:.2s}
.t-main.open .t-caret{transform:rotate(90deg)}
.t-main.open{background:var(--wash)}
.t-detail td{background:var(--wash);padding:0;border-bottom:1px solid var(--line)}
.t-detail-inner{padding:18px 22px 22px}
.t-detail-inner .why{font-size:13.5px;color:var(--ink2);line-height:1.55}
.t-detail-inner .why b{color:var(--ink)}
.filt-legend{display:flex;flex-wrap:wrap;gap:18px 28px;padding:0 2px 16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.fl-group{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.fl-t{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.fl-i{font-size:11.5px;color:var(--mut)}
.fl-i b{font-weight:600;margin-right:4px}
.fl-hint{flex-basis:100%;font-size:11.5px;color:var(--mut);padding-top:4px;max-width:var(--measure)}
.hint-link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;font-weight:600;font-style:normal}
.hint-link:hover{color:#8f3522}
.quad-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px 14px}
.quad-svg{width:100%;height:auto;display:block}
.quad-tick{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;fill:var(--mut)}
.quad-axis{font-size:12px;fill:var(--ink2);font-weight:500}
.quad-corner{font-size:11px;fill:#155c3c;font-weight:700}
.quad-leg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--ink2)}
.quad-leg span{display:flex;align-items:center;gap:6px}
.quad-leg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.quad-leg2{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ql{display:flex;flex-direction:column;gap:5px}
.ql-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink)}
.ql-h i{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.ql-d{font-size:11.5px;color:var(--mut);line-height:1.45}
@media(max-width:680px){.quad-leg2{grid-template-columns:1fr 1fr}}
.radar-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.radar-grid{grid-template-columns:1fr}}
.radar-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px}
.rp-head{display:flex;align-items:baseline;justify-content:space-between}
.rp-nom{font-family:'Fraunces',serif;font-size:19px;color:var(--ink)}
.rp-n{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13px;color:var(--mut)}
.rp-desc{font-size:12.5px;color:var(--ink2);margin:2px 0 4px}
.rp-svg{width:100%;height:auto;display:block}
.radar-more{font-size:11px;font-weight:700;font-family:"IBM Plex Mono"}
.radar-ring-lbl{font-size:9px;font-weight:600;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;letter-spacing:.01em;opacity:.85}
.adv-note{margin-top:12px;background:var(--wash);border-left:3px solid var(--calc);border-radius:6px;padding:11px 14px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.adv-note b{color:var(--ink)}
/* 0.10.13: los avisos de fila destacan («que lotes y vías de entrada destaquen
   más»): cuerpo micro de la escala (10.5), relleno pleno en "vía de entrada"
   (es una señal de oportunidad) y contorno firme en "lotes" (es un aviso). */
.lote-tag{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--ink2);color:#fff;border:1.5px solid var(--ink2);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.ia-tag{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10.5px;letter-spacing:.06em;background:var(--ia-bg);color:var(--ia);border:1px solid var(--ia);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;font-weight:600}
.mp-tag{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--card);color:var(--mp);border:1.5px solid var(--mp);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;font-weight:600}
.ia-toggle{border:1px solid var(--line);background:var(--card);font:inherit;font-size:13px;font-weight:500;color:var(--ink2);padding:8px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.ia-toggle:hover{border-color:var(--ia-line)}
.ia-toggle.on{background:var(--ia-bg);border-color:var(--ia);color:var(--ia)}
.ia-toggle .udot{width:8px;height:8px;border-radius:50%;display:inline-block}
tr.is-ia .t-rank{box-shadow:inset 3px 0 0 var(--ia)}
.ia-head{background:var(--ia-bg);border:1px solid var(--ia-line);border-radius:12px;padding:18px 22px;margin:6px 0 16px}
.ia-head-t{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ia);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ia-head-t .udot{width:9px;height:9px;border-radius:50%}
.ia-head-body p{font-size:14.5px;color:var(--ink2);line-height:1.6;margin-bottom:6px}
.ia-head-note{font-size:12.5px!important;color:var(--mut)!important}
.temas{display:flex;flex-direction:column;gap:8px}
.tema{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
/* 0.11.1 — PATRÓN ÚNICO DE SELECCIONABLE (extraído de la tarjeta de Temas, que
   gustó al usuario): casilla de 16px radio 6 (rellena del color al marcar, con
   ✓ blanco), borde de 1.5px + tinte suave al seleccionar, título 600 + definición
   gris + datos en el color. El color de selección es el AZUL corporativo salvo
   que el elemento tenga color semántico propio (tema IA = morado). */
.tema.on{border:1.5px solid var(--ia);background:#f9f7fd;padding:11.5px 13.5px}
.tema-check{width:16px;height:16px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:2px}
.tema.on .tema-check{background:var(--ia);border-color:var(--ia)}
.tema-nom{font-weight:600;font-size:13.5px;color:var(--ink)}
.tema-def{font-size:12.5px;color:var(--mut);margin-top:2px}
.tema-pos{font-size:11.5px;color:var(--ia);font-weight:500;margin-top:6px}
.tema-soon{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;border:1px solid var(--line2);padding:1px 6px;border-radius:6px;margin-left:6px}
.guia-h{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:20px;font-weight:500;color:var(--ink);margin:30px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.glos{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gl-row{display:flex;gap:18px;background:var(--card);padding:14px 18px;align-items:baseline}
.gl-k{flex-shrink:0;width:150px;font-weight:600;font-size:13px}
.gl-k.go{color:var(--go)}.gl-k.exp{color:var(--explore)}.gl-k.calc{color:var(--calc)}.gl-k.no{color:var(--no)}
.gl-k.urg-ya{color:#b1402a}.gl-k.neutral{color:var(--ink)}.gl-k.ia{color:var(--ia)}
.gl-v{font-size:13px;color:var(--ink2);line-height:1.5}
@media(max-width:600px){.gl-row{flex-direction:column;gap:4px}.gl-k{width:auto}}
.guia-p{font-size:13px;color:var(--ink2);line-height:1.55;margin:0 0 14px;max-width:var(--measure)}
.tldr{display:block;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin:22px 0 4px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.tldr b{color:var(--ink)}
.tldr-k{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(184,71,47,.08);border:1px solid rgba(184,71,47,.30);border-radius:6px;padding:2px 7px;margin-right:9px;vertical-align:1px}
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;margin-top:4px}
.cmp th,.cmp td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none}
.cmp thead th{background:var(--wash);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600}
.cmp thead th:first-child{background:var(--card)}
.cmp tbody th{font-weight:600;color:var(--ink);width:140px;background:var(--card);font-size:12.5px}
.cmp td{color:var(--ink2)}.cmp td b{color:var(--ink)}
.cmp td+td{border-left:1px solid var(--line2)}
.faq{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.faq summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:18px;font-weight:400;color:var(--mut);line-height:1}
.faq details[open] summary::after{content:"\2013"}
.faq details[open] summary{border-bottom:1px solid var(--line)}
.faq .faq-a{padding:13px 16px;font-size:13px;color:var(--ink2);line-height:1.55}.faq .faq-a b{color:var(--ink)}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 9px);z-index:60;width:240px;max-width:62vw;background:var(--ink);color:#fff;font-size:11.5px;font-weight:400;line-height:1.45;letter-spacing:normal;text-transform:none;text-align:left;padding:9px 11px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;visibility:hidden;transform:translateY(-3px);transition:opacity .14s,transform .14s;pointer-events:none;white-space:normal}
.tip::before{content:"";position:absolute;left:16px;top:calc(100% + 3px);z-index:61;border:6px solid transparent;border-bottom-color:var(--ink);opacity:0;visibility:hidden;transition:opacity .14s}
.tip:hover::after,.tip:hover::before,.tip:focus-visible::after,.tip:focus-visible::before{opacity:1;visibility:visible;transform:translateY(0)}
/* narrativa mensual */
.narr{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:26px 30px;margin:26px 0 6px}
.narr-h{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.narr ol{margin:0;padding-left:22px}
/* 0.10.10: las frases del mes estaban en 15px (cuerpo fuera de escala) y a todo
   el ancho de la tarjeta — a la escala de descripción (14.5) y a --measure. */
.narr li{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:12px;max-width:var(--measure)}
.narr li:last-child{margin-bottom:0}
.narr small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
/* arena competitiva */
.arena{margin-top:8px}
.arena-row{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px 20px;margin-bottom:10px}
.arena-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.arena-cat{font-size:14.5px;font-weight:600;color:var(--ink)}
.arena-sit{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap}
.arena-sit.LIDERA{background:var(--go-bg);color:var(--go)}
.arena-sit.RETA{background:var(--calc-bg);color:var(--calc)}
.arena-sit.DETRAS{background:var(--explore-bg);color:var(--explore)}
.arena-sit.AUSENTE{background:var(--no-bg);color:var(--no)}
.arena-rel{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.arena-bars{display:flex;flex-direction:column;gap:6px}
.arena-bar{display:flex;align-items:center;gap:10px;font-size:12.5px}
.arena-bar .nm{width:170px;flex-shrink:0;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena-bar.me .nm{color:var(--ink);font-weight:600}
.arena-bar .track{flex:1;height:9px;background:var(--wash);border-radius:6px;overflow:hidden}
.arena-bar .track i{display:block;height:100%;background:var(--mut);border-radius:6px}
.arena-bar.me .track i{background:var(--accent)}
.arena-bar .vv{width:32px;flex-shrink:0;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;color:var(--mut)}
/* resumen con jerarquía: el ítem clave pesa más */
.sm-item.lead-fig{grid-column:span 2}
.sm-item.lead-fig .sm-fig{font-size:40px}
.sm-item.lead-fig{background:linear-gradient(135deg,#1f3a2e,#2a5443)}
.sm-item.lead-fig .sm-fig,.sm-item.lead-fig .sm-txt{color:#fff}
.sm-item.lead-fig .sm-txt{opacity:.9}
footer{padding:40px 0 60px;color:var(--mut);font-size:12px;line-height:1.6}
@media(max-width:780px){
  .band{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr}
  .opp-top{flex-wrap:wrap}.opp-right{text-align:left}
  thead th{top:110px}
}

/* intro explainer */
.explainer{background:linear-gradient(180deg,#fff,var(--wash));border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin:30px 0}
.explainer h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:19px;margin-bottom:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:4px}
.step{font-size:13px}
.step .sn{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;color:var(--accent);font-weight:500}
.step .st{font-weight:600;margin:4px 0 3px;font-size:13.5px}
.step .sd{color:var(--ink2);font-size:12.5px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line2)}
.lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.lg .d{width:9px;height:9px;border-radius:50%}
.lg.go .d{background:var(--go)}.lg.exp .d{background:var(--explore)}.lg.calc .d{background:var(--calc)}.lg.no .d{background:var(--no)}

/* expandable ranking */
.expl-row{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden;transition:.15s}
.expl-row:hover{border-color:#d2d5dd}
.expl-head{display:flex;gap:14px;align-items:center;padding:15px 18px;cursor:pointer}
.expl-rank{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px;color:var(--mut);width:30px;flex-shrink:0}
.expl-main{flex:1;min-width:0}
.expl-title{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expl-sub{font-size:12px;color:var(--mut);margin-top:2px}
.expl-imp{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:16px;font-weight:500;flex-shrink:0}
.expl-caret{flex-shrink:0;color:var(--mut);transition:.2s;font-size:12px}
.expl-row.open .expl-caret{transform:rotate(90deg)}
.expl-row.open .expl-title{white-space:normal}
.expl-detail{display:none;padding:0 18px 18px 62px;border-top:1px solid var(--line2);margin-top:0}
.expl-row.open .expl-detail{display:block;padding-top:15px}
.expl-detail .why{font-size:13.5px;color:var(--ink2);line-height:1.55}
.expl-detail .why b{color:var(--ink)}
.layer{margin-top:14px}
.layer-t{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.factors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.factor{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 11px;background:var(--wash);border-radius:6px}
.factor .fl{color:var(--ink2)}.factor .fv{font-weight:600;color:var(--ink);text-align:right}
.factor.pos{background:var(--go-bg)}.factor.neg{background:var(--no-bg)}
.depth{display:flex;gap:0;margin:16px 0 6px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.depth div{flex:1;text-align:center;font-size:11px;padding:7px 4px;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;color:var(--mut);background:var(--card);border-right:1px solid var(--line2)}
.depth div:last-child{border:none}
.depth div.active{background:var(--ink);color:#fff}

/* fiche */
.fiche{max-width:760px}
.fiche-card{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin-top:24px}
.fiche-field{display:flex;gap:18px;padding:18px 24px;border-bottom:1px solid var(--line2)}
.fiche-field:last-child{border:none}
.fiche-field .fn{width:170px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--ink)}
.fiche-field .fbody{flex:1}
.fiche-field .fv{font-size:13.5px;color:var(--ink);margin-bottom:4px}
.fiche-field .fnote{font-size:12.5px;color:var(--mut);line-height:1.45}
.origin{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}
.origin.inferido{background:var(--calc-bg);color:var(--calc)}
.origin.declarado{background:var(--explore-bg);color:#7d5410}
.fiche-open{padding:18px 24px;background:var(--wash);font-size:13px;color:var(--ink2)}
.fiche-open b{color:var(--ink)}
.crit-explain{margin-top:36px}
.crit-explain h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:21px;margin-bottom:6px}
.crit-explain>p{font-size:14px;color:var(--ink2);max-width:var(--measure);margin-bottom:22px}
.crit{border-left:3px solid var(--line);padding:4px 0 4px 18px;margin-bottom:20px}
.crit.go{border-color:var(--go)}.crit.exp{border-color:var(--explore)}
.crit.calc{border-color:var(--calc)}.crit.no{border-color:var(--no)}
.crit h4{font-size:13.5px;font-weight:600;margin-bottom:4px}
.crit p{font-size:13px;color:var(--ink2);line-height:1.5}


/* waves */
.waves{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:30px 0 8px}
.wave{background:var(--card);padding:18px 20px}
.wave .wn{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.wave .wc{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:30px;font-weight:500;line-height:1}
.wave .wd{font-size:12px;color:var(--ink2);margin-top:7px;line-height:1.4}
.wave.ahora{box-shadow:inset 3px 0 0 var(--go)}
.wave.sig{box-shadow:inset 3px 0 0 var(--explore)}
.wave.radar{box-shadow:inset 3px 0 0 var(--mut)}
.cap-note{font-size:12.5px;color:var(--mut);margin:0 0 30px;line-height:1.5}
.cap-note b{color:var(--ink2)}
.ola-pill{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.ola-pill.AHORA{background:var(--go-bg);color:var(--go)}
.ola-pill.SIGUIENTE{background:var(--explore-bg);color:var(--explore)}
.ola-pill.RADAR{background:var(--wash);color:var(--mut)}

/* fiche interactive controls */
.fctrl{position:relative}
.fselect{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.15s;font-weight:500}
.fselect:hover{border-color:#c8ccd5;background:var(--wash)}
.fselect .car{color:var(--mut);font-size:10px;transition:.2s}
.fctrl.open .fselect .car{transform:rotate(180deg)}
.fopts{display:none;position:absolute;z-index:30;top:calc(100% + 5px);left:0;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px;max-height:260px;overflow:auto}
.fctrl.open .fopts{display:block}
.fopt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.fopt:hover{background:var(--wash)}
.fopt .bx{width:16px;height:16px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.fopt.sel .bx{background:var(--accent);border-color:var(--accent)}
.fopt.sel{color:var(--ink);font-weight:500}
.fboxwrap{display:flex;flex-wrap:wrap;gap:11px 9px}
.fbox{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;transition:.15s}
.fbox:hover{border-color:#c8ccd5;background:var(--wash)}
.fbox .bx{width:16px;height:16px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.fbox.sel{background:#F0F7FA;border:1.5px solid var(--accent);padding:7.5px 11.5px;color:var(--ink);font-weight:500}
.export-block{margin-top:22px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:20px 22px}
.export-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.export-h{font-weight:600;font-size:14.5px;color:var(--ink)}
.export-sub{font-size:12.5px;color:var(--mut);margin-top:4px;max-width:var(--measure);line-height:1.5}
.export-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--go);background:var(--go);color:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.export-btn:hover{background:#1a6848;border-color:#1a6848}
.export-panel{margin-top:18px;display:none}
.export-panel.open{display:block}
.export-tabs{display:flex;gap:8px;margin-bottom:10px}
.export-tab{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;transition:.15s}
.export-tab.on{background:var(--go-bg);border-color:var(--go);color:var(--ink);font-weight:500}
.export-pre{margin:0;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
.export-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.export-act{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;transition:.15s;font-weight:500}
.export-act:hover{border-color:var(--go);color:var(--go)}
.export-ok{color:var(--go);font-size:12.5px;font-weight:600;opacity:0;transition:.2s}
.export-ok.show{opacity:1}
.export-count{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:3px 11px;margin-top:9px}
.export-count b{color:var(--go)}
.fwarns{display:flex;flex-direction:column;gap:10px;margin:0 0 20px}
.fwarn{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:13px;line-height:1.5;color:var(--ink2)}
.fwarn b{color:var(--ink)}
.fwarn-i{flex-shrink:0;font-size:14px;line-height:1.5}
.fwarn.warn{background:var(--explore-bg);border-color:#e6cf93}.fwarn.warn .fwarn-i{color:var(--explore)}
.fwarn.danger{background:#fdecea;border-color:#f0bcb3}.fwarn.danger .fwarn-i{color:var(--accent)}
.fh{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;background:var(--paper)}
.fh-frame{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--wash)}
.fh-seg{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:6px 12px;border-radius:6px;white-space:nowrap}
.fh-seg.on{background:var(--ink);color:#fff}
.fh-body{padding:18px 20px 22px}
.fh-strat{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:23px;font-weight:500;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.fh-strat small{display:block;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.fh-sub{font-size:13px;color:var(--ink2);line-height:1.55;margin:11px 0 18px;max-width:var(--measure)}
.fh-grid{display:grid;grid-template-columns:1fr 1.15fr 1.2fr;gap:20px;align-items:stretch}
.fh-figs{display:flex;flex-direction:column;gap:16px;justify-content:center}
.fh-fig .v{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:29px;font-weight:500;color:var(--ink);line-height:1}
.fh-fig .v.urg{color:var(--accent)}
.fh-fig .k{font-size:11.5px;color:var(--mut);margin-top:6px}
.fh-panel{display:flex;flex-direction:column;justify-content:center;gap:11px;background:var(--wash);border-radius:12px;padding:15px 17px}
.fh-row{padding:0}
.fh-rk{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}
.fh-rv{font-size:13px;color:var(--ink);font-weight:500;line-height:1.4}
.fh-band{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:12px;margin-left:4px;vertical-align:1px}
.fh-band.b-bajo{color:var(--go);background:var(--go-bg)}
.fh-band.b-medio{color:var(--explore);background:var(--explore-bg)}
.fh-band.b-alto{color:var(--accent);background:#fdecea}
/* 0.11.0: el histórico de precios deja el beige (único del informe) y adopta la
   gramática de AVISO: lavado neutro + filete izquierdo, como los adv-note. */
.fh-caveat{background:var(--wash);border-left:3px solid var(--ink2);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;justify-content:center}
.fh-caveat-h{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.14em}
.fh-caveat-b{font-size:12px;color:var(--ink2);line-height:1.5}.fh-caveat-b b{color:var(--ink)}
.fh-cta{display:flex;justify-content:flex-end;margin-top:24px}
.fh-cta a{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#fff;background:var(--go);border:1px solid var(--go);border-radius:12px;padding:13px 24px;text-decoration:none;transition:.15s;box-shadow:0 3px 10px rgba(31,122,84,.24)}
.fh-cta a:hover{background:#1a6848;border-color:#1a6848}
@media(max-width:760px){.fh-grid{grid-template-columns:1fr;gap:18px}.fh-frame{overflow-x:auto}}
.fbox.sel .bx{background:var(--accent);border-color:var(--accent)}
.ranks{counter-reset:rk}
.rankitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line2);border-radius:6px;margin-bottom:6px;font-size:13.5px;background:var(--card);cursor:grab}
.rankitem .grip{display:flex;align-items:center;flex-shrink:0;margin:0 -2px 0 -2px}
.rankitem .grip svg circle{fill:#b9bdc6}
.rankitem:hover .grip svg circle{fill:var(--mut)}
.rankitem.dragging{opacity:.4;background:var(--wash);cursor:grabbing}
.rankitem .num{counter-increment:rk;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px;color:var(--accent);font-weight:500;width:18px}
.rankitem .num::before{content:counter(rk)}
.rankitem .gr{color:var(--mut);margin-left:auto;font-size:11px}
.rankitem .obj-name{font-weight:600;color:var(--ink)}
.rankitem .obj-def{color:var(--mut);font-size:12.5px;margin-left:6px}
@media(max-width:560px){.rankitem{flex-wrap:wrap}.rankitem .obj-def{margin-left:28px;flex-basis:100%}}
.chosen{margin-top:8px;font-size:12.5px;color:var(--mut)}


/* capacity budget panel */
.cap-panel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:26px;margin:30px 0}
.cap-panel .ct{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;font-size:21px;margin-bottom:4px}
.cap-panel .cdesc{font-size:13.5px;color:var(--ink2);margin-bottom:22px;max-width:var(--measure)}
.cap-meter{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.cap-meter .big{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:38px;font-weight:500;line-height:1}
.cap-meter .unit{font-size:13px;color:var(--mut)}
.cap-track{height:14px;border-radius:6px;background:var(--wash);overflow:hidden;display:flex;margin:14px 0 6px;border:1px solid var(--line2)}
.cap-seg{height:100%;border-right:2px solid #fff}
.cap-seg.defender{background:#1f7a54}.cap-seg.crecer{background:#2f9e6e}
.cap-seg.conquistar{background:#7ab89a}.cap-seg.diversificar{background:#a9d2c0}.cap-seg.posicionarme{background:#cfe7dc}
.cap-seg.libre{background:repeating-linear-gradient(45deg,var(--wash),var(--wash) 5px,#eef0f4 5px,#eef0f4 10px)}
.cap-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink2);margin-top:10px}
.cap-legend .li{display:flex;align-items:center;gap:6px}
.cap-legend .sw{width:11px;height:11px;border-radius:6px}
.cap-rows{margin-top:22px}
.cap-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.cap-row:last-child{border:none}
.cap-row .lab{width:200px;flex-shrink:0;font-size:13.5px;font-weight:500}
.cap-row .lab small{display:block;color:var(--mut);font-weight:400;font-size:11.5px;margin-top:1px}
.cap-row .barwrap{flex:1;height:8px;background:var(--wash);border-radius:6px;overflow:hidden}
.cap-row .barwrap i{display:block;height:100%}
.cap-row .res{width:140px;flex-shrink:0;text-align:right;font-size:12.5px;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace}
.cap-row .res.ok{color:var(--go)}.cap-row .res.warn{color:var(--explore)}.cap-row .res.out{color:var(--mut)}
.cap-warn{margin-top:20px;background:var(--explore-bg);border-radius:12px;padding:15px 18px;font-size:13px;color:#6b4d12;line-height:1.5}
.cap-warn b{color:#5a3f0a}
.cap-out{margin-top:16px;font-size:13px;color:var(--ink2);background:var(--wash);border-radius:12px;padding:15px 18px}
.cap-out b{color:var(--ink)}
.cap-out ul{margin:8px 0 0;padding-left:18px}.cap-out li{margin:3px 0}


.urg{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;font-weight:500;letter-spacing:.03em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.urg.YA{background:#fbe9e7;color:#b1402a}
.urg.PRONTO{background:#fbf2dd;color:#9a6a16}
.urg.MARGEN{background:var(--wash);color:var(--mut)}
.urg .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.t-urg{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:10px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.t-urg.YA{background:#fbe9e7;color:#b1402a}.t-urg.PRONTO{background:#fbf2dd;color:#9a6a16}.t-urg.MARGEN{color:var(--mut)}

/* 0.11.0 — foco de teclado único (mismo anillo que el buscador) y respeto a
   la preferencia de menos movimiento del sistema. */
[role="button"]:focus-visible,.tab:focus-visible,.tip:focus-visible,summary:focus-visible,.fselect:focus-visible,.export-btn:focus-visible,.export-tab:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,153,237,.35)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

  if(x.estado==='CALCULAR') return `<b>${t}</b> es una de tus categorías fuertes, pero <b>${x.pprec} de los 100 puntos se deciden por precio</b>. Ganar puede exigir un descuento que comprima el margen. La pregunta no es si puedes ganar, sino si te conviene: calcula el precio mínimo rentable antes de comprometerte.`;
  if(x.estado==='EXPLORAR'){
    if(x.des_rate>=0.06) return `Todavía no has ganado en esta categoría, pero <b>queda desierta el ${Math.round(x.des_rate*100)}% de las veces</b>: hay demanda pública que no encuentra oferta válida. Es una oportunidad de entrada; revisa el pliego para confirmar si conviene.`;
    return `Presencia incipiente en esta categoría. Hay base para valorarla, aunque todavía no para un sí directo. El pliego dirá si los requisitos encajan con lo que puedes acreditar.`;
  }
  return `Una categoría donde no tienes presencia y que se decide por precio${x.incumbente?`, con <b>${tc(x.incumbente)}</b> como proveedor instalado`:''}. Sin nada que te haga ganar aquí, preparar la candidatura consume recursos que rinden más en tus categorías fuertes.`;
}
const negritas=t=>t.replace(/(\d+(?:[.,]\d+)*\s?(?:M€|€|%|º)?)/g,'<b>$1</b>');
/* estadoLabel(), factors(), depth(), depthBar(), urgPill(), explRow() y pick()
   retirados en 0.2.5: eran las listas por estado del dossier antiguo (pre-TAM)
   y ya no los llamaba ninguna pestaña. whyText() sigue vivo: lo usa la ficha
   de fila de "A qué presentarte" (js_dash). */


/* ---------- DOSSIER ---------- */
/* radar() y quadrant() retirados en 0.2.4: código muerto (vista sustituida por TAM). */

/* Tildes y siglas que el dato trae sin acento (viene de MAYÚSCULAS + .title()).
   Solo presentación — el dato interno no se toca. Pendiente (f) del estado. */
const TILDES={'Gestion':'Gestión','Microinformatica':'Microinformática','Informatica':'Informática',
  'Tecnica':'Técnica','Aragon':'Aragón','It':'IT','Erp':'ERP','Pcs':'PCs','Cpd':'CPD',
  'De':'de','Del':'del','Y':'y','La':'la','Aena':'AENA','Ejie':'EJIE','Izfe':'IZFE'};
const tld=s=>String(s).split(' ').map((w,i)=>i===0&&(w==='De'||w==='Del'||w==='Y'||w==='La')?w:(TILDES[w]||w)).join(' ');

/* ---------- PLAZOS VIVOS (mejora APARCADA en 0.9.1, lista para activar) ----------
   Con PLAZOS_VIVOS=true, los días al cierre se recalculan al ABRIR el informe
   contra la fecha del dispositivo (el slim conserva los del corte; solo
   presentación); una fila con plazo vencido se marca `cerrada`, se atenúa y
   deja de contar como urgente. Umbrales del motor: YA ≤7 · PRONTO 8–15
   (colocación con diccionario y glosario). Decisión del cliente 16/07: fuera
   de momento — con la edición demo del 09/06 marcaba 89 de 152 como cerradas.
   Con el interruptor en false, days_live/urg_live == days_left/urg del corte. */
const PLAZOS_VIVOS=false;
function _dmy(s){const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null;}
const HOY=new Date(); HOY.setHours(0,0,0,0);
const fmtHoy=HOY.toLocaleDateString('es-ES');
D.ranking.forEach(x=>{
  if(PLAZOS_VIVOS){
    const d=_dmy(x.lim);
    x.days_live=d?Math.round((d-HOY)/86400000):x.days_left;
    x.cerrada=typeof x.days_live==='number'&&x.days_live<0;
    x.urg_live=x.cerrada?'CERR':(x.days_live==null?x.urg:(x.days_live<=7?'YA':(x.days_live<=15?'PRONTO':'MARGEN')));
  }else{
    x.days_live=x.days_left; x.cerrada=false; x.urg_live=x.urg;
  }
});
const CERRADAS=D.ranking.filter(x=>x.cerrada).length;

/* ============ ENFOQUE — la personalización, declarada en la introducción ============
   (spec cliente: el informe dice en portada con qué lentes y recortes está construido).
   Datos: D.enfoque (tam.py). Cada elemento enlaza conceptualmente con Personalización. */
/* enfoqueStrip() retirada en 0.9.8: la tira de solo-lectura "Tu enfoque" duplicaba
   los mismos campos que la ficha editable de Personalización mostraba justo debajo
   ("piezas pegadas", feedback del usuario). Su información única migró a la ficha:
   cuentas que sigues, restricción de importe (ahora ajustable) y capacidad. */

/* ================= VISTA TAM — sustituye al mapa de oportunidad ================= */
/* Todas las cifras salen de los bloques D.tam / D.top_licitaciones /
   D.vencimientos / D.competidores, calculados por tam.py desde el dato real. */
// 0.9.12: formato de la maqueta elegida por el usuario — arranque en azul marino
// corporativo (#2C3E50) en vez de negro; cifras DENTRO de las barras.
// 0.11.0: los rellenos que llevan cifra BLANCA dentro usan las tintas AA
// (--go 5.4:1, --accent 4.8:1); --go-fill/--accent-fill (3.3/3.1:1) quedan
// para superficies sin texto (barras de vencimientos, tinte de tarjetas).
const TAMc={pub:'#2C3E50',cut:'#C7D0D9',rest:'var(--ink2)',reach:'var(--go)'};

function tamCascada(){
  const t=D.tam; if(!t) return '';
  const REST_MIN=(D.enfoque&&D.enfoque.restricciones&&D.enfoque.restricciones[0]&&D.enfoque.restricciones[0].eur)||0;
  // 0.10.0 (MENOR): el "mercado real" se PARTE en defender/atacar, calculado
  // desde D.ranking (misma base que la cascada): defender = postura DEFENDER
  // (organismos donde ya trabaja, cli_org>0 o titularidad); atacar = CRECER +
  // CONQUISTAR (donde aún no trabaja). Se excluye AUSENTE (es el recorte "sin
  // experiencia"). GUARDA de coherencia: si la suma no cuadra con con_exp_eur
  // (±1 %, p. ej. si cambia la definición del corte en tam.py), NO se parte.
  let SPLIT=null;
  if(!t.capacidad&&D.ranking&&D.ranking.length&&t.con_exp_eur){
    const s={def:[0,0],ata:[0,0]};
    D.ranking.forEach(r=>{if(r.plevel==='AUSENTE')return;const g=(r.postura==='DEFENDER')?s.def:s.ata;g[0]+=r.imp||0;g[1]++;});
    if(Math.abs(s.def[0]+s.ata[0]-t.con_exp_eur)<=0.01*t.con_exp_eur&&s.def[0]>0&&s.ata[0]>0) SPLIT=s;
  }
  const ANW=SPLIT?180:0;                     // gotera derecha para las anotaciones
  const W=720+ANW,H=308,baseY=232,top=54,x0=22;
  // Calibración tipográfica (0.10.11): el SVG se estira al ancho de la tarjeta
  // (~1092 px), así que un font-size nominal NO es lo que se ve. FS(t) devuelve
  // el nominal que RENDERIZA a t px — los gráficos usan la misma escala que el
  // texto del documento (valor 15 · cuerpo denso 12.5 · etiqueta mono 11 · nota 11.5).
  const FS=t=>(t*W/1092).toFixed(2);
  const max=Math.max(t.publicado_eur,1);
  const yv=v=>baseY-(v/max)*(baseY-top);
  const pct=v=>Math.round(100*v/max)+' %';
  // Waterfall (vocabulario visual FT): los TOTALES se anclan a la base y los
  // RECORTES flotan entre el nivel anterior y el nuevo (top/bot explícitos).
  // Con capacidad DECLARADA: 5 columnas (…→ fuera de capacidad → alcanzable).
  // Sin declarar: 3 columnas y el TAM efectivo termina en "donde ya has ganado"
  // — no se inventa un límite de equipo que el cliente no ha dado.
  const CAP=t.capacidad;
  const cols=[
    {lab:(REST_MIN?['Publicado este mes','(≥ '+fmtM(REST_MIN)+', tu restricción)']:['Publicado','este mes']),n:t.publicado_n+' licitaciones',top:yv(t.publicado_eur),bot:baseY,col:TAMc.pub,tag:fmtM(t.publicado_eur)},
    {lab:['Categorías sin','experiencia previa'],n:t.sin_exp_n+' lic.'+(CAP?'':' · '+pct(t.sin_exp_eur)+' de lo publicado'),top:yv(t.publicado_eur),bot:yv(t.con_exp_eur),col:TAMc.cut,cut:1,tag:'−'+fmtM(t.sin_exp_eur)},
  ];
  if(CAP){
    cols.push(
      {lab:['Donde ya has','ganado antes'],n:t.con_exp_n+' lic.',top:yv(t.con_exp_eur),bot:baseY,col:TAMc.rest,tag:fmtM(t.con_exp_eur)},
      {lab:['Fuera de tu','capacidad ('+CAP+')'],n:t.fuera_cap_n+' lic.',top:yv(t.con_exp_eur),bot:yv(t.alcanzable_eur),col:TAMc.cut,cut:1,tag:'−'+fmtM(t.fuera_cap_eur)},
      {lab:['Alcanzable','este mes'],n:t.alcanzable_n+' propuestas',top:yv(t.alcanzable_eur),bot:baseY,col:TAMc.reach,reach:1,tag:fmtM(t.alcanzable_eur)});
  }else{
    cols.push(
      {lab:['Donde ya has ganado antes','— tu mercado real'],n:t.con_exp_n+' lic. · '+pct(t.con_exp_eur)+' de lo publicado',top:yv(t.con_exp_eur),bot:baseY,col:TAMc.reach,reach:1,tag:fmtM(t.con_exp_eur)});
  }
  const gap=20,cw=(W-2*x0-ANW-gap*(cols.length-1))/cols.length,cx=i=>x0+i*(cw+gap);
  let svg='';
  cols.forEach((c,i)=>{
    const x=cx(i),h=Math.max(2,c.bot-c.top);
    if(c.reach&&SPLIT){
      // partición defender (base, verde) / atacar (encima, azul) + anotaciones
      const tot=SPLIT.def[0]+SPLIT.ata[0];
      const defH=h*SPLIT.def[0]/tot, ataH=h-defH;
      svg+=`<rect x="${x.toFixed(1)}" y="${c.top.toFixed(1)}" width="${cw.toFixed(1)}" height="${ataH.toFixed(1)}" fill="var(--accent)"/>`;
      svg+=`<rect x="${x.toFixed(1)}" y="${(c.top+ataH).toFixed(1)}" width="${cw.toFixed(1)}" height="${defH.toFixed(1)}" fill="var(--go-fill)"/>`;
      const ax=x+cw+8, tx=ax+26;
      const yA=c.top+ataH/2, yD=c.top+ataH+defH/2;
      svg+=`<line x1="${(x+cw).toFixed(1)}" y1="${yA.toFixed(1)}" x2="${(tx-6).toFixed(1)}" y2="${yA.toFixed(1)}" stroke="var(--accent)"/>`;
      svg+=`<text x="${tx}" y="${(yA-3).toFixed(1)}" font-size="${FS(12.5)}" fill="var(--ink2)"><tspan font-weight="700" fill="var(--ink)">${fmtM(SPLIT.ata[0])}</tspan> para atacar</text>`;
      svg+=`<text x="${tx}" y="${(yA+11).toFixed(1)}" font-size="${FS(11)}" fill="var(--mut)">donde aún no trabajas · ${SPLIT.ata[1]} lic.</text>`;
      svg+=`<line x1="${(x+cw).toFixed(1)}" y1="${yD.toFixed(1)}" x2="${(tx-6).toFixed(1)}" y2="${yD.toFixed(1)}" stroke="var(--go-fill)"/>`;
      svg+=`<text x="${tx}" y="${(yD-3).toFixed(1)}" font-size="${FS(11.5)}" fill="var(--ink2)"><tspan font-weight="700" fill="var(--ink)">${fmtM(SPLIT.def[0])}</tspan> para defender</text>`;
      svg+=`<text x="${tx}" y="${(yD+11).toFixed(1)}" font-size="${FS(11)}" fill="var(--mut)">donde ya trabajas · ${SPLIT.def[1]} lic.</text>`;
    }else{
      svg+=`<rect x="${x.toFixed(1)}" y="${c.top.toFixed(1)}" width="${cw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c.col}"${c.cut?' stroke="#98A4AF" stroke-width="1" stroke-dasharray="4 3"':''}/>`;
    }
    // conector al nivel donde ARRANCA la siguiente columna (su borde superior)
    if(i<cols.length-1){const ly=cols[i+1].top;svg+=`<line x1="${(x+cw).toFixed(1)}" y1="${ly.toFixed(1)}" x2="${cx(i+1).toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#98A4AF" stroke-dasharray="3 3"/>`;}
    // cifra DENTRO de la barra (formato de la maqueta); si el bloque es fino
    // (p. ej. un recorte del 7 %), no cabe y sube fuera, en su color.
    if(h>=30) svg+=`<text x="${(x+9).toFixed(1)}" y="${(c.top+21).toFixed(1)}" font-size="${FS(15)}" font-weight="700" fill="${c.cut?'var(--ink2)':'#fff'}">${c.tag}</text>`;
    else svg+=`<text x="${(x+2).toFixed(1)}" y="${(c.top-8).toFixed(1)}" font-size="${FS(15)}" font-weight="700" fill="${c.reach?'var(--go)':(c.cut?'var(--ink2)':'var(--ink)')}">${c.tag}</text>`;
    c.lab.forEach((l,j)=>svg+=`<text x="${(x+cw/2).toFixed(1)}" y="${(baseY+20+j*13).toFixed(1)}" text-anchor="middle" font-size="${FS(12.5)}" fill="var(--ink2)">${l}</text>`);
    svg+=`<text x="${(x+cw/2).toFixed(1)}" y="${(baseY+20+c.lab.length*13+1).toFixed(1)}" text-anchor="middle" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">${c.n}</text>`;
  });
  svg+=`<line x1="${x0-6}" y1="${baseY}" x2="${W-x0-ANW+6}" y2="${baseY}" stroke="var(--ink)"/>`;
  const notaRest=`<div class="tam-fuente" style="margin-top:6px">${REST_MIN?`Universo del informe: solo licitaciones de ${fmtM(REST_MIN)} o más, por tu restricción declarada. `:''}No se descuenta por plazo: al día del corte, ${t.plazo_corto_n} de las ${t.publicado_n} cerraban en ${t.plazo_corto_dias} días o menos — esa es la cadencia del mercado.</div>`;
  return `<div class="tam-card"><svg role="img" aria-label="Cascada del mercado: de lo publicado este mes a tu mercado real, con el recorte por categorías sin experiencia" viewBox="0 0 ${W} ${H}" style="width:100%">${svg}</svg>${notaRest}</div>`;
}

/* Desglose del TAM por las dimensiones del cliente (tecnología, territorio,
   vertical, cuentas objetivo, estrategia). Datos: D.tam.dimensiones (tam.py). */
function dimRows(items,opts){
  const o=opts||{};const max=Math.max(...items.map(i=>i.eur),1);
  return items.map(i=>{
    const w=Math.max(1.5,100*i.eur/max);
    const col=o.color?o.color(i):'#97A3AF';
    return `<div class="dimrow${i.ambiguo||i.sin_clasificar?' dim-mut':''}">
      <span class="dim-n">${esc(tld(i.nombre))}</span>
      <span class="dim-bar"><i style="width:${w.toFixed(1)}%;background:${col}"></i></span>
      <span class="dim-v">${fmtM(i.eur)}<small> · ${i.n}</small></span></div>`;
  }).join('');
}
function tamDimensiones(){
  const dm=D.tam&&D.tam.dimensiones; if(!dm) return '';
  const fuerte=i=>i.nivel==='TERRENO'||i.nivel==='PRESENCIA';
  const tec=dimRows(dm.tecnologia.slice(0,6),{color:i=>fuerte(i)?'var(--go-fill)':'#97A3AF'});
  const terr=dimRows(dm.territorio,{color:i=>i.declarada?'var(--go-fill)':(i.ambiguo?'#C7D0D9':'#97A3AF')});
  const ver=dimRows(dm.vertical,{color:i=>i.sin_clasificar?'#C7D0D9':'var(--ink2)'});
  const cu=dm.cuentas;
  const cuRows=dimRows(cu.lista,{color:()=>'var(--accent-fill)'});
  // Estrategia con las MISMAS barras que el resto de dimensiones (FT: magnitud
  // se compara con longitud, no leyendo cifras sueltas en chips de texto).
  const est=dimRows(dm.estrategia.map(e=>({nombre:(LBL.estrategia[e.clave]||{}).nom||e.clave,eur:e.eur,n:e.n,def:e.clave==='DEFENDER'})),
    {color:i=>i.def?'var(--go-fill)':'#97A3AF'});
  return `<div class="tam-fuente" style="margin:2px 0 0">En cada fila: <b>importe en juego</b> (M€) · <b>nº de licitaciones</b>.</div>
  <div class="tam-dims">
    <div class="tam-card"><div class="tam-h">Por tecnología</div>
      <div class="tam-lead" style="font-size:13px">En verde, categorías donde ya tienes historial de adjudicación.</div>${tec}</div>
    <div class="tam-card"><div class="tam-h">Por territorio</div>
      <div class="tam-lead" style="font-size:13px">En verde, tus zonas declaradas. Nada se descarta por territorio: muchos organismos compran para cualquier administración.</div>${terr}</div>
    <div class="tam-card"><div class="tam-h">Por vertical</div>
      <div class="tam-lead" style="font-size:13px">Clasificación orientativa por tipo de organismo; no altera el orden del ranking.</div>${ver}</div>
    <div class="tam-card"><div class="tam-h">En las cuentas que sigues</div>
      <div class="tam-lead" style="font-size:13px"><strong>${fmtM(cu.en_cuentas_eur)} en ${cu.en_cuentas_n} licitaciones</strong> de las cuentas que sigues${cu.origen==='inferido'?' — lista deducida de tu histórico; declara la tuya y la próxima edición se recalcula':''}. Es una lente para medir, no altera el orden del ranking.</div>${cuRows}</div>
  </div>
  <div class="tam-card" style="margin-top:14px"><div class="tam-h">Por estrategia — qué papel juega este volumen</div>
    <div class="tam-lead" style="font-size:13px">De lo publicado, el papel que juega cada euro según tus objetivos declarados. En verde, defender contratos que ya son tuyos; el orden de objetivos se ajusta en <b>Personalización</b> (en Cómo leerlo).</div>${est}</div>`;
}

function topLicitaciones(){
  const T=D.top_licitaciones; if(!T||!T.items.length) return '';
  const items=T.items.slice(0,10);
  const max=Math.max(...items.map(i=>i.imp),1);
  const AZUL='var(--accent-fill)', GRIS='#AEB9C4';
  const rows=items.map(i=>{
    const w=Math.max(3,100*i.imp/max), col=i.con_posicion?AZUL:GRIS;
    const org=i.con_posicion
      ? `${esc(tc(i.org))} · <b style="color:var(--accent)">ya tienes ${i.cli_org} contrato${i.cli_org===1?'':'s'} aquí</b>`
      : `${esc(tc(i.org))} · <span style="color:var(--mut)">organismo nuevo para ti</span>`;
    return `<div class="tl-row">
      <div class="tl-txt"><div class="tl-tit">${esc(tc(i.titulo))}</div><div class="tl-org">${org}</div></div>
      <div class="tl-bar"><i style="width:${w.toFixed(1)}%;background:${col}"></i></div>
      <div class="tl-imp">${(i.imp/1e6).toFixed(1)} M€</div>
    </div>`;
  }).join('');
  return `<div class="tam-card" style="margin-top:14px">
    <div class="tam-h">Las 10 mayores licitaciones de 2 M€ o más</div>
    <div class="tam-lead">De las <b>${T.n_total}</b> licitaciones por encima de 2 M€, <b>${T.n_total-T.n_con_posicion}</b> están en organismos donde aún no tienes contratos — y ahí se concentra el mayor volumen. Cada barra es una licitación; el color dice si ya trabajas con ese organismo.</div>
    <div class="tl-legend"><span><i class="tl-sw" style="background:${AZUL}"></i>Ya tienes contratos en el organismo</span><span><i class="tl-sw" style="background:${GRIS}"></i>Organismo nuevo para ti</span></div>
    <div class="tl-list">${rows}</div>
  </div>`;
}

/* importes muy grandes: en M€ con separador de miles (más claro que "B€") */
const fmtBig=v=>v>=1e9?(Math.round(v/1e6)).toLocaleString('es-ES')+' M€':fmtM(v);
function mercadoVence(){
  const v=D.vencimientos; if(!v) return '';
  // Rediseño 0.9.11 (feedback: "no me gusta este gráfico", eligió la opción A):
  // tres barras ORDENADAS sobre escala común, etiqueta y cifra pegadas a cada
  // barra (sin leyenda aparte); la referencia a lo publicado (×1,8) pasa a
  // texto. La cartera propia va en VERDE (defender, mismo código de color que
  // "Por estrategia") — antes era un trozo negro casi invisible del 5 %.
  const W=700,FS=t=>(t*W/1092).toFixed(2); // calibración 0.10.11
  const rows=[
    {eur:v.comp_fuera_eur,pct:v.comp_fuera_pct,col:'#C7D0D9',lab:['De la competencia, ',['fuera'],' de tus categorías']},
    {eur:v.comp_terreno_eur,pct:v.comp_terreno_pct,col:'var(--accent-fill)',lab:['De la competencia, ',['en tus categorías fuertes']]},
    {eur:v.propia_eur,pct:v.propia_pct,col:'var(--go-fill)',lab:[['Tu cartera propia'],', en renovación']},
  ].sort((a,b)=>b.eur-a.eur);
  const pub=(D.tam&&D.tam.publicado_eur)||0;
  const ratio=pub?(v.total_eur/pub).toFixed(1).replace('.',','):null;
  const lab=parts=>parts.map(p=>Array.isArray(p)?`<tspan font-weight="700">${p[0]}</tspan>`:p).join('');
  let svg=`<text x="0" y="14" font-size="${FS(14.5)}" font-weight="700" fill="var(--ink)">Vencen ${fmtBig(v.total_eur)} en tres meses: casi la mitad, en tus categorías fuertes.</text>`;
  svg+=`<text x="0" y="33" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">DEL ${v.ventana_ini} AL ${v.ventana_fin} · ${v.total_n.toLocaleString('es-ES')} CONTRATOS${ratio?` · ×${ratio} LO PUBLICADO ESTE MES (${fmtM(pub)})`:''}</text>`;
  // escala común: la barra mayor ocupa el ancho de pista disponible
  const X0=268,XV=596,TRACK=XV-X0-12,MAX=Math.max(...rows.map(r=>r.eur),1);
  let y=58;
  rows.forEach(r=>{
    const w=Math.max(3,TRACK*r.eur/MAX);
    svg+=`<text x="0" y="${y+14}" font-size="${FS(13.5)}" fill="var(--ink2)">${lab(r.lab)}</text>`;
    svg+=`<rect x="${X0}" y="${y}" width="${w.toFixed(1)}" height="20" rx="2" fill="${r.col}"/>`;
    svg+=`<text x="${XV+52}" y="${y+14}" text-anchor="end" font-size="${FS(12.5)}" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${fmtM(r.eur)}</text>`;
    svg+=`<text x="${W}" y="${y+14}" text-anchor="end" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">${r.pct} %</text>`;
    y+=34;
  });
  svg+=`<text x="0" y="${y+12}" font-size="${FS(11.5)}" fill="var(--mut)">En azul, donde puedes arrebatar con ventaja; en verde, lo que te toca defender.</text>`;
  return `<div class="tam-card"><svg role="img" aria-label="El mercado que vence en tres meses, repartido entre competencia fuera y dentro de tus categorías y tu cartera propia" viewBox="0 0 ${W} ${y+22}" style="width:100%">${svg}</svg></div>`;
}

function competidoresBaja(sel){
  const c=D.competidores; if(!c||!c.items.length) return '';
  const items=sel&&sel.length?sel:c.items;
  const W=760,rowH=30,top=94,H=top+items.length*rowH+24,FS=t=>(t*W/1092).toFixed(2); // calibración 0.10.11
  const NAMEW=124,AX0=140,AX40=460;             // eje de baja: 0%→140, 40%→460
  const bx=v=>AX0+Math.min(v,40)/40*(AX40-AX0);
  const TX=512,TW=118;                          // columna "cómo adjudica" (tipo)
  const SHADE=[['tec','Técnica',0.85],['mix','Mixta',0.42],['prec','Precio',0.16]];
  let svg=`<text x="0" y="13" font-size="${FS(14.5)}" font-weight="700" fill="var(--ink)">Nadie tiene una política de precio fija: todos licitan entre 0% y 30% según el expediente</text>`;
  // cómo leerlo, en lenguaje del lector (la definición exacta va en la nota al pie)
  svg+=`<text x="0" y="29" font-size="${FS(11.5)}" fill="var(--mut)">Cómo leerlo: la <tspan font-weight="700">banda gruesa</tspan> es su zona habitual de descuento — ahí cae la mitad de sus contratos ganados;</text>`;
  svg+=`<text x="0" y="42" font-size="${FS(11.5)}" fill="var(--mut)">la <tspan font-weight="700">raya vertical</tspan> es su descuento típico, y la línea fina llega hasta sus casos más extremos.</text>`;
  // cabeceras de columna
  svg+=`<text x="${AX0}" y="66" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">BAJA CON LA QUE ADJUDICA — descuento sobre presupuesto</text>`;
  svg+=`<text x="${TX}" y="66" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">CÓMO ADJUDICA — % de contratos por tipo</text>`;
  // CLAVE de las tres tonalidades (una vez, arriba de la columna de tipo)
  let kx=TX;
  SHADE.forEach(([,lab,op])=>{
    svg+=`<rect x="${kx}" y="75" width="9" height="9" fill="var(--ink2)" opacity="${op}"/>`;
    svg+=`<text x="${kx+13}" y="83" font-size="${FS(10.5)}" fill="var(--mut)" font-family="var(--mono)">${lab}</text>`;
    kx+=lab.length*6.4+24;
  });
  // rejilla del eje de baja (los % solo debajo del eje, sin invadir la columna de tipo)
  const plotBot=top+items.length*rowH;
  [0,10,20,30,40].forEach(g=>{const x=bx(g);svg+=`<line x1="${x.toFixed(1)}" y1="${top-8}" x2="${x.toFixed(1)}" y2="${plotBot.toFixed(1)}" stroke="var(--line2)"/><text x="${x.toFixed(1)}" y="${(plotBot+15).toFixed(1)}" text-anchor="middle" font-size="${FS(11)}" fill="var(--mut)" font-family="var(--mono)">${g}%</text>`;});
  items.forEach((it,i)=>{
    const y=top+i*rowH+15,cli=it.es_cliente,col=cli?'var(--accent)':'var(--ink2)';
    svg+=`<text x="0" y="${(y+3).toFixed(1)}" font-size="${FS(12.5)}" fill="${col}" font-weight="${cli?'700':'400'}">${esc(it.nombre.length>15?it.nombre.slice(0,14)+'…':it.nombre)}</text>`;
    svg+=`<text x="${NAMEW}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="${FS(10.5)}" fill="var(--mut)" font-family="var(--mono)">n=${it.n}</text>`;
    svg+=`<line x1="${bx(it.p10).toFixed(1)}" y1="${y}" x2="${bx(it.p90).toFixed(1)}" y2="${y}" stroke="${col}" opacity=".45"/>`;
    svg+=`<rect x="${bx(it.p25).toFixed(1)}" y="${(y-7).toFixed(1)}" width="${Math.max(0,bx(it.p75)-bx(it.p25)).toFixed(1)}" height="14" fill="${col}" opacity=".24"/>`;
    svg+=`<line x1="${bx(it.med).toFixed(1)}" y1="${(y-8).toFixed(1)}" x2="${bx(it.med).toFixed(1)}" y2="${(y+8).toFixed(1)}" stroke="${col}" stroke-width="2.4"/>`;
    let ox=TX;
    SHADE.forEach(([k,,op])=>{const w=TW*it[k]/100;svg+=`<rect x="${ox.toFixed(1)}" y="${(y-6).toFixed(1)}" width="${w.toFixed(1)}" height="12" fill="${col}" opacity="${op}"/>`;ox+=w;});
    svg+=`<text x="${W}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="${FS(10.5)}" fill="var(--mut)" font-family="var(--mono)">${it.tec}/${it.mix}/${it.prec}</text>`;
  });
  return `<div class="tam-card"><svg role="img" aria-label="Bandas de descuento con las que adjudica cada competidor de referencia y reparto de sus contratos por tipo de concurso" viewBox="0 0 ${W} ${H}" style="width:100%">${svg}</svg></div>`;
}

function renderDossier(){
  const r=D.resumen,p=D.perfil,s=D.sumario;
  // vista principal de competidores: el cliente + los 7 de mayor muestra,
  // en el mismo orden (por baja mediana); los demás, plegados a demanda.
  const compAll=(D.competidores&&D.competidores.items)||[];
  const compSel=new Set(compAll.filter(c=>c.es_cliente).concat(
    compAll.filter(c=>!c.es_cliente).slice().sort((a,b)=>b.n-a.n).slice(0,7)));
  const compTop=compAll.filter(c=>compSel.has(c));
  // KPIs en la MISMA unidad (euros; el recuento pasa a la línea secundaria) y en
  // orden de embudo temporal: publicado → tu mercado real → cierra ya → vence después.
  // urgencia con plazos VIVOS: cuenta lo que sigue abierto y cierra en ≤15 días a hoy
  const urgRows=D.ranking.filter(x=>!x.cerrada&&x.days_live!=null&&x.days_live<=15);
  const urg15N=urgRows.length, urg15Eur=urgRows.reduce((a,x)=>a+(x.imp||0),0);
  /* Los bloques del dossier antiguo (listas por estado, huecos, desiertos,
     acecho, renovación) se calculaban aquí sin pintarse desde la vista TAM.
     Retirados en 0.2.5; D.huecos/D.desiertos/D.acecho/D.renovacion siguen en
     el slim para la fase 2 de "Dónde jugar" (antes "Tu mercado"). */

  document.getElementById('dossier').innerHTML=`
  <div class="hero"><div class="wrap">
    <div class="eyebrow">Edición mensual · ${D.fecha} · próxima en un mes</div>
    <h1>Las oportunidades de <span class="nb">${esc(D.cliente)}</span> <span class="nb">este mes</span></h1>
    <p class="sub">De ${r.total} licitaciones abiertas y en plazo a día de hoy${(D.enfoque&&D.enfoque.restricciones&&D.enfoque.restricciones.length)?' que cumplen tu enfoque y tus restricciones':' en tus categorías'}, este informe ordena las que merecen una candidatura por delante de las que consumirían recursos sin retorno, y argumenta el porqué de cada una. Las licitaciones salen a diario y los plazos rondan dos semanas: esta edición es la foto de su fecha de corte, y se renueva cada mes. Tu enfoque completo está en <b>Cómo leerlo</b>.${PLAZOS_VIVOS?` Los plazos de cierre están <b>recalculados a hoy (${fmtHoy})</b>${CERRADAS?` — desde el corte, ${CERRADAS} licitaciones han cerrado ya su plazo y aparecen marcadas`:''}.`:''}</p>
  </div></div>

  <div class="wrap">
    ${D.narrativa&&D.narrativa.frases&&D.narrativa.frases.length?`
    <div class="narr">
      <div class="narr-h">Tu mes en ${D.narrativa.frases.length} frases</div>
      <ol>${D.narrativa.frases.map(f=>`<li title="Dato: ${esc(f.dato)}">${negritas(esc(f.txt))}</li>`).join('')}</ol>
    </div>`:''}
    <div class="kpi-block">
      <div class="kpi-seg">
        <div class="kpi-seg-t">Este mes <span>· ya en juego</span></div>
        <div class="kpi-row now">
          <div class="kpi" onclick="document.getElementById('sec-tam').scrollIntoView({behavior:'smooth'})">
            <div class="v">${fmtM(D.tam.publicado_eur)}</div>
            <div class="l">publicados en tu mercado</div>
            <div class="s">${D.tam.publicado_n} licitaciones en plazo</div>
          </div>
          <div class="kpi kpi-hero" onclick="document.getElementById('sec-tam').scrollIntoView({behavior:'smooth'})">
            <div class="v">${fmtM(D.tam.capacidad?D.tam.alcanzable_eur:D.tam.con_exp_eur)}</div>
            <div class="l">${D.tam.capacidad?'a tu alcance este mes':'en categorías donde ya has ganado'}</div>
            <div class="s">${D.tam.capacidad?D.tam.alcanzable_n+' propuestas, dentro de tu capacidad':D.tam.con_exp_n+' licitaciones con historial propio'}</div>
          </div>
          <div class="kpi kpi-urg" onclick="document.querySelector('.tab[data-v=dash]').click()">
            <div class="v">${fmtM(urg15Eur)}</div>
            <div class="l"><span class="urg-dot"></span>cierran en 15 días o menos</div>
            <div class="s">${urg15N} licitaciones · míralas primero</div>
          </div>
        </div>
      </div>
      <div class="kpi-seg">
        <div class="kpi-seg-t fut">A futuro <span>· próximo trimestre, aún no abierto</span></div>
        <div class="kpi-row fut">
          <div class="kpi kpi-fut" onclick="document.getElementById('sec-vence').scrollIntoView({behavior:'smooth'})">
            <div class="v">${fmtBig(D.vencimientos.total_eur)}</div>
            <div class="l">vencen antes de septiembre</div>
            <div class="s">${D.vencimientos.total_n.toLocaleString('es-ES')} contratos que volverán a salir</div>
          </div>
          <div class="kpi kpi-fut" onclick="document.getElementById('sec-vence').scrollIntoView({behavior:'smooth'})">
            <div class="v">${fmtM(D.vencimientos.comp_terreno_eur)}</div>
            <div class="l">de la competencia, en tus categorías fuertes</div>
            <div class="s">por disputar cuando vuelvan a salir</div>
          </div>
        </div>
      </div>
    </div>

    <section style="margin-top:36px" id="sec-tam">
      <div class="sec-h">Cuánto mercado hay para ti</div>
      <div class="sec-t">De lo publicado este mes, ${fmtM(D.tam.capacidad?D.tam.alcanzable_eur:D.tam.con_exp_eur)} están en tu mercado real</div>
      <div class="sec-d">De <b>${D.tam.publicado_n} licitaciones por ${fmtM(D.tam.publicado_eur)}</b>, ${D.tam.capacidad?`tu experiencia y tu capacidad (${D.tam.capacidad} propuestas al mes) dejan <b>${fmtM(D.tam.alcanzable_eur)} efectivos</b>`:`<b>${fmtM(D.tam.con_exp_eur)} están en categorías donde ya has ganado</b> — tu mercado real`}. La cascada enseña dónde se queda el resto.</div>
      ${tamCascada()}
      <details class="pleg"><summary>Desglosa tu mercado — tecnología, territorio, vertical, cuentas y estrategia</summary><div class="pleg-body">${tamDimensiones()}</div></details>
      <details class="pleg"><summary>Las mayores licitaciones de 2 M€ o más — ${D.top_licitaciones.n_total-D.top_licitaciones.n_con_posicion} de ${D.top_licitaciones.n_total} en organismos donde aún no estás</summary><div class="pleg-body">${topLicitaciones()}</div></details>
    </section>

    <section style="margin-top:36px" id="sec-vence">
      <div class="sec-h">El mercado que vence</div>
      <div class="sec-t">${fmtBig(D.vencimientos.total_eur)} vuelven al mercado antes de septiembre</div>
      <div class="sec-d">Vencen <b>${D.vencimientos.total_n.toLocaleString('es-ES')} contratos</b> — en importe, ${(D.vencimientos.total_eur/D.tam.publicado_eur).toFixed(1).replace('.',',')} veces lo publicado este mes. <b>${fmtM(D.vencimientos.comp_terreno_eur)} son de la competencia en tus categorías consolidadas</b> y ${fmtM(D.vencimientos.en_cuentas_eur)} caen en cuentas que sigues.</div>
      ${mercadoVence()}
      <div class="tam-fuente">El horizonte del dato termina el ${D.vencimientos.horizonte_fin}; no hay visibilidad posterior. Preparar un organismo lleva más de un trimestre: conviene ampliar la fuente.</div>
    </section>

    <section style="margin-top:36px" id="sec-comp">
      <div class="sec-h">Los competidores</div>
      <div class="sec-t">Nadie es caro o barato: ajustan el precio al expediente</div>
      <div class="sec-d">La baja con la que gana cada competidor${D.competidores.desde?` en los últimos años (adjudicaciones de ${D.competidores.desde} a ${D.competidores.hasta})`:''}, reconstruida de presupuesto vs. adjudicación. Lo que de verdad los distingue es <b>el tipo de concurso en el que ganan</b> — técnica, mixta o precio.</div>
      ${competidoresBaja(compTop)}
      <details class="pleg"><summary>Ver los ${D.competidores.items.length} competidores de referencia</summary><div class="pleg-body">${competidoresBaja()}</div></details>
      <div class="tam-fuente">Base: ${D.competidores.base_n.toLocaleString('es-ES')} adjudicaciones con ambos importes públicos${D.competidores.desde?`, ganadas entre ${D.competidores.desde} y ${D.competidores.hasta}`:''}. La baja es dato observado, no estimado — y solo de ganadores: es un suelo, no el umbral de victoria. (Definición exacta del dibujo: banda = percentiles 25–75 · raya = mediana · línea fina = percentiles 10–90.)</div>
    </section>

  </div>
  <footer><div class="wrap"><div style="max-width:var(--measure)">TendersTool · Sales Intelligence Engine · Informe del ${D.fecha} para ${esc(D.cliente)} (caso de demostración). Recomendaciones basadas en datos de adjudicaciones del sector público. La decisión de presentarte es tuya.</div></div></footer>`;
}
</script>
